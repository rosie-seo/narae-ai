<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무보고 저장본</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script src="/resources/js/component/ui-include.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body data-report-nav="work">

  <div class="operating-container">

    <div data-include="/html/code/header.html"></div>

    <div class="organization-container">

      <!-- 사이드 네비게이션 (보고 공통 LNB) -->
      <div data-include="/html/code/report-side-nav.html"></div>

      <!-- 메인 콘텐츠 -->
      <main class="main" style="padding:0; overflow:auto;">

        <!-- 보고 정보 헤더 -->
        <header class="gnb-sub">
          <div class="task-id">
            <span class="krds-badge bg-light-gray" id="wr-badge">제출완료</span>
            <div class="task-titles">
              <strong class="task-name" id="wr-title">업무보고</strong>
              <span class="task-meta" id="wr-meta">작성자 · 보고기간</span>
            </div>
            <span class="chevron" aria-hidden="true">&rsaquo;</span>
          </div>
          <button type="button" class="btn-log" onclick="location.href='/resources/pages/work-report.html'">
            <span class="ico" aria-hidden="true">&#8592;</span> 목록으로
          </button>
        </header>

        <div class="layout" style="grid-template-columns: minmax(0,1fr);">
          <div id="wr-body">

            <!-- 기본 정보 -->
            <section class="report-section">
              <h2 class="section-title">기본 정보</h2>
              <div class="krds-table-wrap report-basic">
                <table class="tbl col data">
                  <caption>업무보고 기본 정보</caption>
                  <colgroup><col style="width:14%"><col><col style="width:14%"><col></colgroup>
                  <tbody>
                    <tr>
                      <th scope="row">작성자</th><td id="wr-author">-</td>
                      <th scope="row">팀</th><td id="wr-team">-</td>
                    </tr>
                    <tr>
                      <th scope="row">보고 기간</th><td id="wr-period">-</td>
                      <th scope="row">저장 일시</th><td id="wr-saved">-</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <!-- 자유 기술 (종합 의견) -->
            <section class="report-section">
              <h2 class="section-title">주간보고 종합 의견</h2>
              <p class="write-item__text" id="wr-free"></p>
            </section>

            <!-- 항목별 작성 내용 -->
            <section class="report-section">
              <div class="report-section__head">
                <h2 class="section-title">항목별 작성 내용</h2>
                <span class="report-section__hint" id="wr-count"></span>
              </div>
              <div id="wr-items"></div>
            </section>

            <!-- 액션 -->
            <div class="write-actions">
              <span class="write-actions__saved" id="wr-hint"></span>
              <button type="button" class="krds-btn medium secondary" id="btnEdit">수정하기</button>
              <button type="button" class="krds-btn medium primary" id="btnAi">이 보고로 만든 주간보고 보기</button>
            </div>

          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/resources/js/script.js"></script>
  <script>
  (function () {
    const raw  = sessionStorage.getItem('krds_selected_work_report');
    const body = document.getElementById('wr-body');

    if (!raw) {
      body.innerHTML = '<p style="padding:24px;color:var(--krds-light-color-text-disabled)">업무보고 정보가 없습니다. 목록에서 보고를 선택해 주세요.</p>';
      return;
    }

    // 목록에서 넘겨받은 저장본을 저장소의 최신 내용으로 다시 읽는다
    const picked = JSON.parse(raw);
    const rec    = getWorkReportOf(picked.periodStart, picked.periodEnd) || picked;
    const me     = getCurrentUser();

    /* ── 헤더 ── */
    const badge = document.getElementById('wr-badge');
    badge.textContent = rec.submitted ? '제출완료' : '임시저장';
    badge.className   = rec.submitted ? REPORT_STATUS_CLASS.submitted : REPORT_STATUS_CLASS.draft;
    document.getElementById('wr-title').textContent = rec.periodStart + ' ~ ' + rec.periodEnd + ' 업무보고';
    document.getElementById('wr-meta').textContent  = teamLabel(me.sil, me.dept) + ' · ' + me.name + ' ' + me.role;
    document.title = rec.periodStart + ' 업무보고';

    /* ── 기본 정보 ── */
    document.getElementById('wr-author').textContent = me.name + ' ' + me.role + (me.position ? ' (' + me.position + ')' : '');
    document.getElementById('wr-team').textContent   = teamLabel(me.sil, me.dept);
    document.getElementById('wr-period').textContent = rec.periodStart + ' ~ ' + rec.periodEnd;
    document.getElementById('wr-saved').textContent  = rec.savedAt || '-';

    /* ── 항목별 작성 내용 ── */
    const entries = rec.entries || {};
    const tasks   = getWbsTasksOf(me.name).filter(t => (entries[workReportTaskKey(t)] || '').trim());
    const asOf    = parseISODate(rec.periodEnd);

    document.getElementById('wr-count').textContent = '작성 항목 ' + tasks.length + '건';

    document.getElementById('wr-items').innerHTML = tasks.length
      ? tasks.map(t => {
          const risk = computeTaskRisk(t, asOf);
          const delayTag = (t.status !== 'done' && risk.tier !== 'ok')
            ? `<span class="krds-badge small ${risk.tier === 'danger' ? 'bg-light-danger' : 'bg-light-warning'}">지연</span>`
            : '';
          return `
            <section class="write-item write-item--read">
              <div class="write-item__head">
                <span class="${STATUS_CLASS[t.status]}">${STATUS_LABEL[t.status]}</span>
                ${delayTag}
                <h3 class="write-item__title">${escapeHtml(t.title)}</h3>
                <span class="write-item__period">${t.start} ~ ${t.end}</span>
              </div>
              <p class="write-item__text">${escapeHtml(entries[workReportTaskKey(t)])}</p>
            </section>`;
        }).join('')
      : '<p class="task-empty">항목별로 작성한 내용이 없습니다.</p>';

    /* ── 자유 기술 ── */
    const free = (rec.freeNote || '').trim();
    const freeEl = document.getElementById('wr-free');
    freeEl.textContent = free || '작성된 종합 의견이 없습니다.';
    freeEl.classList.toggle('is-empty', !free);

    /* ── 액션 ── */
    document.getElementById('wr-hint').textContent = rec.submitted
      ? '제출한 보고입니다. 수정하면 주간·월간보고에도 다시 반영됩니다.'
      : '아직 제출하지 않은 임시저장본입니다.';

    document.getElementById('btnEdit').addEventListener('click', () => {
      location.href = '/resources/pages/work-report-write.html?period=' + encodeURIComponent(rec.periodStart);
    });

    document.getElementById('btnAi').addEventListener('click', () => {
      const report = getMyReport('weekly');
      if (report) sessionStorage.setItem('krds_selected_report', JSON.stringify(report));
      location.href = '/resources/pages/weekly-report-detail.html';
    });
  })();
  </script>

</body>
</html>
