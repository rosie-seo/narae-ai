<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script src="/resources/js/component/ui-include.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body>


  <div class="operating-container">

    <div data-include="/html/code/header.html"></div>

    <div class="organization-container">

      <!-- 사이드 네비게이션 -->
      <nav class="side-nav" aria-label="업무 네비게이션">
        <ul class="nav-tree" role="list">
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <a href="/resources/pages/operating.html" class="nav-node__row" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">업무 테이블</span>
            </a>
          </li>
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <a href="/resources/pages/operating-calendar.html" class="nav-node__row is-selected" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">업무 캘린더</span>
            </a>
          </li>
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <a href="/resources/pages/operating-gantt.html" class="nav-node__row" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">업무 차트</span>
            </a>
          </li>
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <a href="/resources/pages/operating-registeration.html" class="nav-node__row" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">업무 등록</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- 메인 콘텐츠 -->
      <main class="main">
        <h1 class="page-title">업무 캘린더</h1>

        <!-- 툴바 -->
        <div class="oc-toolbar">
          <div class="oc-toolbar__row">
            <div class="oc-toolbar__nav">
              <button class="oc-nav-btn" title="이전 달">&#8249;</button>
              <button class="oc-nav-btn" title="다음 달">&#8250;</button>
            </div>
            <span class="oc-month-label">1월 2026</span>
            <div class="oc-scope-selector">
              <button data-scope="company" class="active">회사 캘린더</button>
              <button data-scope="personal">개인 캘린더</button>
            </div>
          </div>
          <div class="oc-toolbar__row">
            <select class="krds-form-select small oc-person-select" id="ocPersonSelect" title="담당자 선택" hidden></select>
            <div class="oc-view-selector">
              <button data-view="day">일</button>
              <button data-view="week">주</button>
              <button data-view="month">월</button>
              <button data-view="3month">3개월</button>
            </div>
          </div>
        </div>

        <!-- 달력 그리드 -->
        <div class="oc-grid">

          <!-- 요일 헤더 -->
          <div class="oc-day-headers">
            <div class="oc-day-header">월</div>
            <div class="oc-day-header">화</div>
            <div class="oc-day-header">수</div>
            <div class="oc-day-header">목</div>
            <div class="oc-day-header">금</div>
            <div class="oc-day-header weekend">토</div>
            <div class="oc-day-header weekend">일</div>
          </div>

          <div class="oc-weeks"></div>
        </div>
      </main>

    </div>
  </div>

<script src="/resources/js/script.js"></script>
</body>
</html>
