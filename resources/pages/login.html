<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · Narae AI</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body class="login-body">

  <main class="login-shell">
    <div class="login-wrap">

      <!-- 로고 (카드 위) -->
      <h1 class="login-logo">
        <img src="/resources/img/component/icon/ico_logo_narae_ai.svg" alt="Narae AI" width="103" height="42">
      </h1>

      <section class="login-card login-card--center">

        <header class="login-card__head">
          <p class="login-card__title">환영합니다</p>
          <p class="login-card__desc">계정 정보를 입력해 업무 시스템에 접속하세요.</p>
        </header>

        <form class="login-form" id="loginForm" novalidate>

          <!-- 아이디 -->
          <div class="login-field">
            <label class="sr-only" for="loginId">아이디</label>
            <svg class="login-field__ico" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M2.9 5.2h14.2c.44 0 .8.36.8.8v8c0 .44-.36.8-.8.8H2.9a.8.8 0 0 1-.8-.8V6c0-.44.36-.8.8-.8Z"
                stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="m2.4 6.2 7.6 5.2 7.6-5.2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="text" id="loginId" class="krds-input" placeholder="아이디를 입력해 주세요"
              autocomplete="username" spellcheck="false">
          </div>

          <!-- 비밀번호 -->
          <div class="login-field">
            <label class="sr-only" for="loginPw">비밀번호</label>
            <svg class="login-field__ico" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M4.6 8.6h10.8c.44 0 .8.36.8.8v6.2c0 .44-.36.8-.8.8H4.6a.8.8 0 0 1-.8-.8V9.4c0-.44.36-.8.8-.8Z"
                stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M6.8 8.4V6.6a3.2 3.2 0 0 1 6.4 0v1.8M10 11.8v2"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input type="password" id="loginPw" class="krds-input" placeholder="비밀번호를 입력해 주세요"
              autocomplete="current-password">
          </div>

          <p class="login-form__msg" id="loginMsg" role="status" aria-live="polite"></p>

          <button type="submit" class="krds-btn large primary login-submit" id="btnLogin">로그인</button>
        </form>

        <!-- 권한별 테스트 계정 -->
        <div class="login-accounts">
          <p class="login-accounts__title">테스트 계정 <span>비밀번호 공통 1234</span></p>
          <ul class="login-accounts__list" id="testAccountList"></ul>
        </div>

      </section>

      <!-- 카드 아래 안내 -->
      <p class="login-foot">
        아직 계정이 없으신가요?
        <a href="/resources/pages/signup.html" id="btnSignup">회원가입 신청</a>
      </p>

    </div>
  </main>

  <!-- 비밀번호 5회 오류 안내 모달 -->
  <section id="pwLockModal" class="krds-modal fade" role="dialog" aria-labelledby="pwLockTitle">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="pwLockTitle" class="modal-title">비밀번호 초기화가 필요합니다</h2>
        </div>
        <div class="modal-conts">
          <div class="conts-area">
            <p class="pw-lock__desc" id="pwLockDesc"></p>
            <div class="krds-table-wrap report-basic pw-lock__table">
              <table class="tbl col data">
                <caption>계정 담당자 연락처</caption>
                <colgroup><col style="width:32%"><col></colgroup>
                <tbody>
                  <tr><th scope="row">담당자</th><td id="pwLockPerson">-</td></tr>
                  <tr><th scope="row">소속</th><td id="pwLockDept">-</td></tr>
                  <tr><th scope="row">이메일</th><td id="pwLockEmail">-</td></tr>
                  <tr><th scope="row">연락처</th><td id="pwLockPhone">-</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="modal-btn btn-wrap">
          <button type="button" class="krds-btn medium tertiary close-modal">닫기</button>
          <button type="button" class="krds-btn medium primary" id="btnResetRequest">초기화 요청 보내기</button>
        </div>
        <button type="button" class="krds-btn medium icon btn-close close-modal">
          <span class="sr-only">닫기</span>
          <i class="svg-icon ico-popup-close"></i>
        </button>
      </div>
    </div>
    <div class="modal-back"></div>
  </section>

  <script src="/resources/js/script.js"></script>
  <script>
  (function () {
    const form  = document.getElementById('loginForm');
    const idEl  = document.getElementById('loginId');
    const pwEl  = document.getElementById('loginPw');
    const msgEl = document.getElementById('loginMsg');

    function setMsg(text, type) {
      msgEl.textContent = text || '';
      msgEl.className = 'login-form__msg' + (type ? ' is-' + type : '');
    }

    // 로그아웃 직후 진입한 경우 안내
    if (!getAuthState().loggedIn) {
      setMsg('로그아웃되었습니다. 다시 로그인해 주세요.', 'info');
    }

    /* 권한별 테스트 계정 — 누르면 입력란이 채워진다 */
    document.getElementById('testAccountList').innerHTML = TEST_ACCOUNTS.map(function (a) {
      const member = findMemberProfile(a.userName);
      const where  = member ? member.dept : '';
      const state  = getPwState(a.loginId).changedAt ? '비밀번호 변경됨'
                   : a.temporary ? '임시 비밀번호' : '';
      return '<li>' +
        '<button type="button" class="login-accounts__item" data-id="' + a.loginId + '">' +
          '<span class="login-accounts__perm">' + PERMISSION_LABEL[a.permission] + '</span>' +
          '<span class="login-accounts__id">' + a.loginId + '</span>' +
          (state ? '<span class="login-accounts__state">' + state + '</span>' : '') +
          '<span class="login-accounts__who">' + a.userName + (where ? ' · ' + where : '') + '</span>' +
        '</button></li>';
    }).join('');

    document.getElementById('testAccountList').addEventListener('click', function (e) {
      const btn = e.target.closest('[data-id]');
      if (!btn) return;
      idEl.value = btn.dataset.id;
      pwEl.value = passwordOf(btn.dataset.id);
      setMsg('');
      pwEl.focus();
    });

    /* ── 비밀번호 5회 오류 안내 모달 ── */
    const modal = document.getElementById('pwLockModal');
    let lockedId = '';

    function openPwLockModal(loginId) {
      lockedId = loginId;
      const mgr = getAccountManager();
      document.getElementById('pwLockDesc').textContent =
        '비밀번호를 ' + LOGIN_FAIL_LIMIT + '회 잘못 입력했습니다. 보안을 위해 로그인이 제한되었습니다. ' +
        '아래 계정 담당자에게 비밀번호 초기화를 요청해 주세요.';
      document.getElementById('pwLockPerson').textContent = mgr.name + (mgr.role ? ' ' + mgr.role : '');
      document.getElementById('pwLockDept').textContent   = teamLabel(mgr.sil, mgr.dept);
      document.getElementById('pwLockEmail').textContent  = mgr.email || '-';
      document.getElementById('pwLockPhone').textContent  = mgr.phone || '-';

      if (typeof krds_modal !== 'undefined') {
        krds_modal.openModal('pwLockModal');
      } else {
        // KRDS 스크립트가 없을 때도 열리도록 최종 표시 상태를 직접 적용한다
        modal.classList.add('shown', 'in');
        modal.style.opacity = '1';
        modal.style.visibility = 'visible';
        modal.querySelector('.modal-back').classList.add('in');
        document.body.classList.add('scroll-no');
      }
    }

    function closePwLockModal() {
      if (typeof krds_modal !== 'undefined') {
        krds_modal.closeModal('pwLockModal');
      } else {
        modal.classList.remove('shown', 'in');
        modal.style.opacity = '';
        modal.style.visibility = '';
        modal.querySelector('.modal-back').classList.remove('in');
        document.body.classList.remove('scroll-no');
      }
    }

    // 페이지에 .open-modal 트리거가 없으면 KRDS가 닫기 버튼을 연결하지 않으므로 직접 연결한다
    modal.querySelectorAll('.close-modal').forEach(function (btn) {
      btn.addEventListener('click', function (e) { e.preventDefault(); closePwLockModal(); });
    });

    document.getElementById('btnResetRequest').addEventListener('click', function () {
      clearLoginFails(lockedId);
      closePwLockModal();
      setMsg('비밀번호 초기화 요청이 담당자에게 전달되었습니다. 승인되면 임시 비밀번호가 발급됩니다.', 'success');
      pwEl.value = '';
      pwEl.focus();
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const id = idEl.value.trim();
      const pw = pwEl.value;

      if (!id) { setMsg('아이디를 입력해 주세요.', 'error'); idEl.focus(); return; }

      // 이미 5회를 넘겼다면 더 시도하지 않고 안내부터 띄운다
      if (isLoginLocked(id)) { openPwLockModal(id); return; }

      if (!pw) { setMsg('비밀번호를 입력해 주세요.', 'error'); pwEl.focus(); return; }

      const result = authenticate(id, pw);
      if (!result.ok) {
        if (result.reason === 'unknown') {
          setMsg('등록되지 않은 아이디입니다. 아래 테스트 계정을 확인해 주세요.', 'error');
          idEl.focus();
          return;
        }

        const fails = addLoginFail(id);
        if (fails >= LOGIN_FAIL_LIMIT) {
          openPwLockModal(id);
        } else {
          setMsg('비밀번호가 올바르지 않습니다. (' + fails + '/' + LOGIN_FAIL_LIMIT + '회 오류)', 'error');
          pwEl.select();
        }
        return;
      }

      loginUser(result.account);
      setMsg('로그인되었습니다. 잠시만 기다려 주세요.', 'success');

      // 임시 비밀번호로 처음 로그인한 계정은 비밀번호 재설정 안내 화면을 지난다
      window.location.href = isTempPassword(result.account.loginId)
        ? '/resources/pages/password-reset.html'
        : '/index.html';
    });
  })();
  </script>

</body>
</html>
