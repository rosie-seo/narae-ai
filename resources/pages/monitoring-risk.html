<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리스크 알림</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script src="/resources/js/component/ui-include.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body>

<div class="operating-container">

  <div data-include="/html/code/header.html"></div>

  <div class="organization-container">

    <!-- 사이드 네비게이션 -->
    <nav class="side-nav" aria-label="모니터링 네비게이션">
      <ul class="nav-tree" role="list">
        <li class="nav-node nav-node--leaf nav-node--depth0">
          <a href="/resources/pages/monitoring-dashboard.html" class="nav-node__row" style="--depth: 0">
            <span class="nav-node__caret"></span>
            <span class="nav-node__label">부서 대시보드</span>
          </a>
        </li>
        <li class="nav-node nav-node--leaf nav-node--depth0">
          <a href="/resources/pages/monitoring-risk.html" class="nav-node__row is-selected" style="--depth: 0">
            <span class="nav-node__caret"></span>
            <span class="nav-node__label">리스크 알림</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- 메인 콘텐츠 -->
    <main class="main">
    <div class="page-header">
      <div class="page-title-group">
        <div class="page-title">리스크 알림</div>
        <div class="page-desc">목표 대비 진척이 뒤처진 과제 중 경고 · 위험 등급 항목만 모아 보여줍니다</div>
      </div>
    </div>

    <div class="risk-summary" id="riskSummary"></div>

    <div class="risk-filter" id="riskFilter">
      <button class="filter-btn active" data-tier="all">전체</button>
      <button class="filter-btn" data-tier="danger">위험</button>
      <button class="filter-btn" data-tier="warning">경고</button>
    </div>

    <div class="risk-list-panel" id="riskList"></div>

    <div class="krds-pagination" id="riskPagination">
      <span class="page-navi prev disabled" href="#">이전</span>
      <div class="page-links"></div>
      <a class="page-navi next" href="#">다음</a>
    </div>
    </main>

  </div>
</div>

<script src="/resources/js/script.js"></script>
<script>
(function () {
  const TIER_LABEL = { danger: "위험", warning: "경고" };
  const sentKeys = new Set();
  let currentFilter = "all";
  const PAGE_SIZE = 10;
  let currentPage = 1;

  const pagination = document.getElementById("riskPagination");
  const pageLinks  = pagination.querySelector(".page-links");
  const prevNav    = pagination.querySelector(".page-navi.prev");
  const nextNav    = pagination.querySelector(".page-navi.next");

  const risks = getRiskTasks();
  const dangerCount = risks.filter(r => r.risk.tier === "danger").length;
  const warningCount = risks.filter(r => r.risk.tier === "warning").length;

  document.getElementById("riskSummary").innerHTML = `
    <div class="risk-stat risk-stat--danger">
      <div class="risk-stat__icon">!</div>
      <div><div class="risk-stat__value">${dangerCount}건</div><div class="risk-stat__label">위험 등급</div></div>
    </div>
    <div class="risk-stat risk-stat--warning">
      <div class="risk-stat__icon">△</div>
      <div><div class="risk-stat__value">${warningCount}건</div><div class="risk-stat__label">경고 등급</div></div>
    </div>
    <div class="risk-stat risk-stat--total">
      <div class="risk-stat__icon">Σ</div>
      <div><div class="risk-stat__value">${risks.length}건</div><div class="risk-stat__label">전체 리스크 과제</div></div>
    </div>
  `;

  function keyOf(row) { return row.leaf.name + ":" + row.task.title; }

  function riskCardHTML(row, i) {
    const r = row.risk;
    const lead = getLeafLead(row.leaf);
    const overdue = r.daysToEnd < 0;
    const statusText = overdue
      ? `마감 ${fmtDue(row.task.end)} · D+${-r.daysToEnd} 초과`
      : `목표 대비 ${Math.abs(r.diff)}%p 지연 · 마감 ${fmtDue(row.task.end)}`;
    const key = keyOf(row);
    const sent = sentKeys.has(key);

    return `
      <div class="risk-card risk-card--${r.tier}" data-tier="${r.tier}" data-key="${escapeHtml(key)}">
        <div class="risk-card__top">
          <div>
            <div class="risk-card__title">${escapeHtml(row.task.title)}</div>
            <div class="risk-card__meta">
              <span>${escapeHtml(row.sil)} · ${escapeHtml(row.leaf.name)}</span>
              <span>담당 ${escapeHtml(row.task.owner)}</span>
              <span>${STATUS_LABEL[row.task.status]}</span>
            </div>
          </div>
          <span class="krds-badge ${r.tier === 'danger' ? 'bg-light-danger' : 'bg-light-warning'}">${TIER_LABEL[r.tier]}</span>
        </div>
        <div class="risk-card__note">${statusText}</div>
        <div class="risk-route ${sent ? 'is-sent' : ''}">
          <div class="risk-route__suggest">
            ${sent ? "✓ 라우팅 요청 전달됨 →" : "권한자 라우팅 제안:"}
            ${lead ? `<b>${escapeHtml(lead.name)}</b><span class="role">${escapeHtml(lead.role)} · ${escapeHtml(lead.position)}</span>` : "<span class=\"role\">지정된 권한자 없음</span>"}
          </div>
          <button type="button" class="krds-btn small ${sent ? 'basic' : 'primary'} risk-route__btn" ${sent || !lead ? "disabled" : ""}>
            ${sent ? "요청 완료" : "라우팅 요청 보내기"}
          </button>
        </div>
      </div>
    `;
  }

  function renderPagination(totalItems) {
    const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
    prevNav.classList.toggle("disabled", currentPage === 1);
    nextNav.classList.toggle("disabled", currentPage >= totalPages);

    const pages = [];
    if (totalPages <= 7) {
      for (let i = 1; i <= totalPages; i++) pages.push(i);
    } else {
      pages.push(1);
      if (currentPage > 3) pages.push("…");
      for (let i = Math.max(2, currentPage - 1); i <= Math.min(totalPages - 1, currentPage + 1); i++) pages.push(i);
      if (currentPage < totalPages - 2) pages.push("…");
      pages.push(totalPages);
    }
    pageLinks.innerHTML = pages.map(p =>
      p === "…"
        ? '<span class="page-link link-dot"></span>'
        : `<a class="page-link${p === currentPage ? " active" : ""}" href="#" data-page="${p}">${p === currentPage ? '<span class="sr-only">현재페이지 </span>' : ""}${p}</a>`
    ).join("");
  }

  function render() {
    const visible = risks.filter(row => currentFilter === "all" || row.risk.tier === currentFilter);
    const totalPages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const slice = visible.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE);

    const listEl = document.getElementById("riskList");
    listEl.innerHTML = slice.length
      ? slice.map(riskCardHTML).join("")
      : `<div class="risk-empty">해당 등급의 리스크 과제가 없습니다.</div>`;

    listEl.querySelectorAll(".risk-route__btn:not([disabled])").forEach(btn => {
      btn.addEventListener("click", () => {
        const card = btn.closest(".risk-card");
        sentKeys.add(card.dataset.key);
        render();
      });
    });

    renderPagination(visible.length);
  }

  document.getElementById("riskFilter").querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#riskFilter .filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.tier;
      currentPage = 1;
      render();
    });
  });

  pagination.addEventListener("click", e => {
    e.preventDefault();
    const visible = risks.filter(row => currentFilter === "all" || row.risk.tier === currentFilter);
    const totalPages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
    const link = e.target.closest("[data-page]");
    if (link) {
      currentPage = parseInt(link.dataset.page, 10);
    } else if (e.target.closest(".page-navi.prev:not(.disabled)")) {
      currentPage = Math.max(1, currentPage - 1);
    } else if (e.target.closest(".page-navi.next:not(.disabled)")) {
      currentPage = Math.min(totalPages, currentPage + 1);
    } else {
      return;
    }
    render();
  });

  render();
})();
</script>

</body>
</html>
