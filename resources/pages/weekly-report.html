<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간보고</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script src="/resources/js/component/ui-include.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body>

  <div class="operating-container">

    <div data-include="/html/code/header.html"></div>

    <div class="organization-container">

      <!-- 사이드 네비게이션 -->
      <nav class="side-nav" aria-label="보고 네비게이션">
        <ul class="nav-tree" role="list">
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <span class="nav-node__row is-selected" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">주간보고 목록</span>
            </span>
          </li>
        </ul>
      </nav>

      <!-- 메인 콘텐츠 -->
      <main class="main">
        <h1 class="page-title">주간보고</h1>

        <!-- 탭 (팀별 보기) -->
        <div class="tab-bar" id="teamTabBar"></div>

        <!-- 주간보고 목록 (실 단위로 그룹핑) -->
        <ul class="task-list task-list--grouped" id="weeklyReportList"></ul>
      </main>

    </div>
  </div>

  <script src="/resources/js/script.js"></script>
  <script>
  (function () {
    // 제출완료된 보고만 노출
    const REPORTS = buildWeeklyReports().filter(r => r.status === 'submitted');

    // 실(팀) 단위로 그룹핑
    const SIL_NAMES = [...new Set(REPORTS.map(r => r.sil))];
    const groups = SIL_NAMES.map(sil => ({ sil, reports: REPORTS.filter(r => r.sil === sil) }));

    const tabBar = document.getElementById('teamTabBar');
    const listEl = document.getElementById('weeklyReportList');
    let currentTeam = 'all';

    tabBar.innerHTML = [
      `<button class="tab active" data-team="all">전체</button>`,
      ...groups.map(g => `<button class="tab" data-team="${escapeHtml(g.sil)}">${escapeHtml(g.sil)}</button>`)
    ].join('');

    function groupHTML(g) {
      return `
        <li class="task-group">
          <div class="task-group__head">
            <span class="task-group__name">${escapeHtml(g.sil)}</span>
            <span class="krds-badge small bg-light-gray">${g.reports.length}건</span>
          </div>
          <ul class="task-list task-list--nested">
            ${g.reports.map(reportCardHTML).join('')}
          </ul>
        </li>
      `;
    }

    function render() {
      let flatReports;

      if (currentTeam === 'all') {
        // 전체: 팀 구분 없이 보고 일자 기준 정렬한 단일 목록
        flatReports = [...REPORTS].sort((a, b) => a.submittedAt.localeCompare(b.submittedAt));
        listEl.classList.remove('task-list--grouped');
        listEl.innerHTML = flatReports.length
          ? flatReports.map(reportCardHTML).join('')
          : '<li class="task-empty">제출완료된 주간보고가 없습니다.</li>';
      } else {
        // 특정 팀: 팀별 그룹 카드로 표시
        const visibleGroups = groups.filter(g => g.sil === currentTeam);
        flatReports = visibleGroups.flatMap(g => g.reports);
        listEl.classList.add('task-list--grouped');
        listEl.innerHTML = visibleGroups.length
          ? visibleGroups.map(groupHTML).join('')
          : '<li class="task-empty">제출완료된 주간보고가 없습니다.</li>';
      }

      listEl.querySelectorAll('.task-card').forEach((card, i) => {
        card.addEventListener('click', () => {
          sessionStorage.setItem('krds_selected_report', JSON.stringify(flatReports[i]));
          window.location.href = '/resources/pages/weekly-report-detail.html';
        });
      });
    }

    tabBar.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        tabBar.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTeam = btn.dataset.team;
        render();
      });
    });

    render();
  })();
  </script>

</body>
</html>
