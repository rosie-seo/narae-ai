<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 상세 · 프로세싱 뷰</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script src="/resources/js/component/ui-include.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body>

  <!-- 드로어 (왼쪽 슬라이드 패널) -->
  <div class="drawer-backdrop" id="drawer-backdrop">
    <iframe class="drawer-iframe" id="drawer-frame" src=""></iframe>
  </div>

  <div class="operating-container">

    <div data-include="/html/code/header.html"></div>

    <div class="organization-container">

      <!-- 사이드 네비게이션 -->
      <nav class="side-nav" aria-label="업무 상세 네비게이션">
        <ul class="nav-tree" role="list">
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <a href="/resources/pages/operating-detail.html" class="nav-node__row" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">과업 리스트 뷰</span>
            </a>
          </li>
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <span class="nav-node__row is-selected" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">프로세싱 뷰</span>
            </span>
          </li>
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <a href="/resources/pages/operating-detail-policy.html" class="nav-node__row" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">규정</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- 메인 콘텐츠 -->
      <main class="main" style="padding:0; overflow:hidden; display:flex; flex-direction:column;">

        <!-- 과제 정보 헤더 -->
        <header class="gnb-sub">
          <div class="task-id">
            <span class="krds-badge bg-light-gray" id="detail-badge">종결</span>
            <div class="task-titles">
              <strong class="task-name" id="detail-task-name">과제 이름 들어가는 곳</strong>
              <span class="task-meta" id="detail-task-meta">담당자명 / 담당 부서 / 참여 인원 7명</span>
            </div>
            <span class="chevron" aria-hidden="true">&rsaquo;</span>
          </div>
          <button type="button" class="btn-log" onclick="history.back()">
            <span class="ico" aria-hidden="true">&#8592;</span> 목록으로
          </button>
        </header>

        <!-- 노드 / 간트 차트 토글 (원래 index.html의 업무 1건짜리 간트 차트 뷰가 이곳으로 이동) -->
        <div class="flow-header" style="padding: var(--krds-number-5) var(--krds-number-8) 0; margin-bottom: 0;">
          <div class="flow-toolbars" style="margin-left: auto;">
            <div class="view-toggle">
              <button class="vt-btn active" data-mode="node" type="button">노드</button>
              <button class="vt-btn" data-mode="gantt" type="button">간트 차트</button>
            </div>
            <div class="unit-toggle">
              <button class="vt-btn active" data-unit="day" type="button">일</button>
              <button class="vt-btn" data-unit="week" type="button">주</button>
              <button class="vt-btn" data-unit="month" type="button">월</button>
            </div>
          </div>
        </div>

        <!-- 흐름도 (JS가 동적 렌더링, React Flow 스타일 캔버스) -->
        <div class="flow-canvas-wrap" id="pvNodeView">
          <div class="flow-viewport" id="flow-viewport">
            <div class="flow-world" id="flow-world">
              <svg class="flow-edges" id="flow-edges"></svg>
            </div>
            <div class="flow-controls">
              <button id="fz-in">+</button>
              <button id="fz-out">−</button>
              <button id="fz-fit">⤢</button>
            </div>
          </div>
        </div>

        <!-- 세부과업 기반 간트 차트 -->
        <div class="flow-body" id="pvGanttView" style="display:none; padding: var(--krds-number-8); box-sizing: border-box;"></div>

      </main>
    </div>
  </div>

  <script src="/resources/js/script.js"></script>
  <script>
  /* ── 드로어 열기/닫기 (iframe 기반 왼쪽 슬라이드) ── */
  (function () {
    const back  = document.getElementById('drawer-backdrop');
    const frame = document.getElementById('drawer-frame');

    window.openDrawer = function () {
      frame.src = '/resources/pages/operating-detail-page.html';
      back.classList.add('drawer-open');
    };

    window.closeDrawer = function () {
      back.classList.remove('drawer-open');
    };

    back.addEventListener('click', e => {
      if (e.target === back) closeDrawer();
    });
  })();

  (function () {
    const raw = sessionStorage.getItem('krds_selected_task');
    const wrap = document.querySelector('.flow-canvas-wrap');

    if (!raw) {
      wrap.innerHTML = '<p style="padding:40px;color:var(--krds-light-color-text-disabled)">업무 정보가 없습니다.</p>';
      return;
    }

    const task = JSON.parse(raw);

    /* ── 헤더 채우기 ── */
    const badge = document.getElementById('detail-badge');
    badge.textContent = STATUS_LABEL[task.status] || task.status;
    badge.className   = STATUS_CLASS[task.status] || 'krds-badge bg-light-gray';
    document.getElementById('detail-task-name').textContent = task.title;
    document.title = task.title + ' · 프로세싱 뷰';

    let teamName = '';
    for (const sil of ORG) {
      for (const leaf of getAllLeaves(sil)) {
        if ((leaf.tasks || []).some(t => t.title === task.title && t.owner === task.owner)) {
          teamName = leaf.name; break;
        }
      }
      if (teamName) break;
    }
    document.getElementById('detail-task-meta').textContent =
      task.owner + (teamName ? ' / ' + teamName : '') + ' / ' + task.start + ' ~ ' + task.end;

    /* ── index.html 조직도 탭과 동일한 워크플로우 뷰(8단계 고정 노드) 렌더링 ── */
    function findOwnerMember(ownerName) {
      for (const sil of ORG) {
        for (const leaf of getAllLeaves(sil)) {
          const m = (leaf.members || []).find(x => x.name === ownerName);
          if (m) return m;
        }
      }
      return null;
    }
    const ownerMember = findOwnerMember(task.owner);
    const worker = { name: task.owner, role: ownerMember ? ownerMember.position : '' };

    function buildWorkflow(worker, task) {
      const doneChain = task.status === 'done';
      const nodes = [
        { id: 'n1', x: 20,  y: 150, type: 'node-start',   tag: '시작', title: task.title, sub: '업무 등록' },
        { id: 'n2', x: 250, y: 150, type: 'node-normal',  tag: '처리', title: `${worker.name} (${worker.role})`, sub: '담당자 처리' },
        { id: 'n3', x: 500, y: 40,  type: 'node-normal',  tag: '협의', title: '팀장 협의', sub: '내부 검토' },
        { id: 'n4', x: 500, y: 260, type: 'node-branch',  tag: '협조', title: '관계부서 협조', sub: '타 부서 의견조회' },
        { id: 'n5', x: 750, y: 150, type: 'node-branch',  tag: '상신', title: '결재 상신', sub: '전자결재 시스템' },
        { id: 'n6', x: 1000,y: 40,  type: 'node-reject',  tag: '반려', title: '반려', sub: '보완 후 재상신' },
        { id: 'n7', x: 1000,y: 260, type: 'node-approve', tag: '승인', title: '결재 완료', sub: '최종 승인' },
        { id: 'n8', x: 1220,y: 150, type: doneChain ? 'node-end' : 'node-normal', tag: doneChain ? '완료' : '예정', title: '시행', sub: doneChain ? '업무 종료' : '시행 대기' },
      ];
      const edges = [
        { from: 'n1', to: 'n2' },
        { from: 'n2', to: 'n3' },
        { from: 'n2', to: 'n4' },
        { from: 'n3', to: 'n5' },
        { from: 'n4', to: 'n5' },
        { from: 'n5', to: 'n6', dashed: true, color: '#e0432b' },
        { from: 'n5', to: 'n7', color: '#2fa84f' },
        { from: 'n6', to: 'n2', dashed: true, color: '#e0432b', loop: true },
        { from: 'n7', to: 'n8' },
      ];
      return { nodes, edges };
    }

    const NODE_W = 170, NODE_H = 54;
    const { nodes, edges } = buildWorkflow(worker, task);
    const totalW = 1220 + NODE_W + 40;
    const totalH = 260 + NODE_H + 60;

    function nodePort(n, side) {
      return side === 'right' ? { x: n.x + NODE_W, y: n.y + NODE_H / 2 } : { x: n.x, y: n.y + NODE_H / 2 };
    }
    function edgePath(edge) {
      const from = nodes.find(n => n.id === edge.from);
      const to   = nodes.find(n => n.id === edge.to);
      const p1 = nodePort(from, 'right');
      const p2 = edge.loop ? nodePort(to, 'left') : nodePort(to, to.x >= from.x ? 'left' : 'right');
      if (edge.loop) {
        // 반려 -> 담당자 처리로 되돌아가는 곡선 (위로 크게 우회)
        const midY = Math.min(p1.y, p2.y) - 140;
        return `M ${p1.x} ${p1.y} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`;
      }
      const dx = Math.max(Math.abs(p2.x - p1.x) * 0.5, 40);
      return `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
    }

    const world = document.getElementById('flow-world');
    const svg   = document.getElementById('flow-edges');
    world.style.width  = totalW + 'px';
    world.style.height = totalH + 'px';

    svg.innerHTML = `
      <defs>
        <marker id="node-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 z" fill="#8b98ac" />
        </marker>
      </defs>
      ${edges.map(e => `<path d="${edgePath(e)}" fill="none"
          stroke="${e.color || '#b7c0cf'}" stroke-width="1.8"
          stroke-dasharray="${e.dashed ? '5,4' : 'none'}"
          marker-end="url(#node-arrow)" />`).join('')}
    `;

    nodes.forEach((n) => {
      const el = document.createElement('div');
      el.className = `flow-node ${n.type}`;
      el.style.left = n.x + 'px';
      el.style.top  = n.y + 'px';
      el.innerHTML = `
        <div class="handle left"></div>
        <div class="fn-tag">${escapeHtml(n.tag)}</div>
        <div class="fn-title">${escapeHtml(n.title)}</div>
        <div class="fn-sub">${escapeHtml(n.sub)}</div>
        <div class="handle right"></div>
      `;
      world.appendChild(el);
    });

    /* ── 팬(드래그) & 줌 ── */
    const viewport = document.getElementById('flow-viewport');
    let zoom = 1, panX = 40, panY = 30;
    function applyTransform() {
      world.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }
    applyTransform();

    let dragging = false, lastX = 0, lastY = 0;
    viewport.addEventListener('mousedown', (e) => {
      dragging = true; lastX = e.clientX; lastY = e.clientY;
      viewport.classList.add('grabbing');
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      panX += (e.clientX - lastX);
      panY += (e.clientY - lastY);
      lastX = e.clientX; lastY = e.clientY;
      applyTransform();
    });
    window.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('grabbing'); });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      zoom = Math.min(1.6, Math.max(0.4, zoom + delta));
      applyTransform();
    }, { passive: false });

    document.getElementById('fz-in').onclick  = () => { zoom = Math.min(1.6, zoom + 0.15); applyTransform(); };
    document.getElementById('fz-out').onclick = () => { zoom = Math.max(0.4, zoom - 0.15); applyTransform(); };
    document.getElementById('fz-fit').onclick = () => { zoom = 1; panX = 40; panY = 30; applyTransform(); };

    /* ── 노드 / 간트 차트 토글 ── */
    let pvMode = 'node';
    let pvGanttUnit = 'day';
    const pvNodeView  = document.getElementById('pvNodeView');
    const pvGanttView = document.getElementById('pvGanttView');

    function setPvMode(mode) {
      pvMode = mode;
      document.querySelectorAll('.vt-btn[data-mode]').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
      pvNodeView.style.display  = mode === 'node' ? 'flex' : 'none';
      pvGanttView.style.display = mode === 'gantt' ? 'flex' : 'none';
      if (mode === 'gantt') renderPvGanttChart();
    }
    document.querySelectorAll('.vt-btn[data-mode]').forEach(btn => {
      btn.addEventListener('click', () => setPvMode(btn.dataset.mode));
    });
    document.querySelectorAll('.vt-btn[data-unit]').forEach(btn => {
      btn.addEventListener('click', () => {
        pvGanttUnit = btn.dataset.unit;
        document.querySelectorAll('.vt-btn[data-unit]').forEach(b => b.classList.toggle('active', b === btn));
        if (pvMode === 'gantt') renderPvGanttChart();
      });
    });

    /* ── 세부과업 기반 간트 차트 (원래 index.html의 업무 1건짜리 간트 차트 로직을
       세부과업 목록 기반으로 일반화) ── */
    function parseISODate(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }
    function isSameDay(a, b) { return a.toDateString() === b.toDateString(); }
    function isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; }
    function fmtMD(date) { return `${date.getMonth() + 1}/${date.getDate()}`; }
    function fmtMDW(date) { const w = ['일','월','화','수','목','금','토'][date.getDay()]; return `${date.getDate()} (${w})`; }
    function diffDays(a, b) { return Math.round((b - a) / 86400000); }
    function fmtMonthShort(date) { return `${date.getMonth() + 1}월`; }

    function buildPvGanttRows() {
      // 메인 경로 단계의 실제 날짜(마감일 기준 2주 타임라인)를 한 번만 계산 — 뷰 단위와 무관하게 고정
      const order = ['n1', 'n2', 'n3', 'n4', 'n5', 'n7', 'n8'];
      const ranges = {
        n1: [0, 1], n2: [1, 4], n3: [4, 6], n4: [4, 6],
        n5: [6, 7], n7: [7, 8], n8: [8, 9],
      };
      const TOTAL_UNITS = 9;
      const TASK_SPAN_DAYS = 14; // 업무 자체의 실제 소요 기간(고정)
      const dueDate = parseISODate(task.end);
      const taskStart = addDays(dueDate, -(TASK_SPAN_DAYS - 1));
      const today = new Date();

      const rows = order.map(id => {
        const n = nodes.find(x => x.id === id);
        const [su, eu] = ranges[id];
        const startOff = Math.round((su / TOTAL_UNITS) * (TASK_SPAN_DAYS - 1));
        const endOff = Math.max(startOff + 1, Math.round((eu / TOTAL_UNITS) * (TASK_SPAN_DAYS - 1)));
        const stepStart = addDays(taskStart, startOff);
        const stepEnd = addDays(taskStart, Math.min(endOff, TASK_SPAN_DAYS - 1));

        let progress = 0, statusClass = 'bar-gray', statusLabel = STATUS_LABEL.wait;
        if (task.status === 'done') { progress = 100; statusClass = 'bar-green'; statusLabel = STATUS_LABEL.done; }
        else if (task.status === 'wait') { progress = 0; statusClass = 'bar-gray'; statusLabel = STATUS_LABEL.wait; }
        else { // progress
          if (today > stepEnd) { progress = 100; statusClass = 'bar-green'; statusLabel = STATUS_LABEL.done; }
          else if (today >= stepStart && today <= stepEnd) { progress = 50; statusClass = 'bar-blue'; statusLabel = STATUS_LABEL.progress; }
          else { progress = 0; statusClass = 'bar-gray'; statusLabel = STATUS_LABEL.wait; }
        }

        return { ...n, startDate: stepStart, endDate: stepEnd, progress, statusClass, statusLabel };
      });
      return { rows, dueDate, taskStart, today };
    }

    function getPvGanttWindow(unit, dueDate) {
      if (unit === 'day') {
        const windowEnd = addDays(dueDate, 3);
        return { windowStart: addDays(windowEnd, -20), windowEnd };
      }
      if (unit === 'week') {
        const windowEnd = addDays(dueDate, 14);
        return { windowStart: addDays(windowEnd, -69), windowEnd };
      }
      const windowEnd = addDays(dueDate, 30);
      return { windowStart: addDays(windowEnd, -209), windowEnd };
    }

    function buildPvHeaderRows(unit, days, today) {
      if (unit === 'day') {
        const weekGroups = [];
        for (let i = 0; i < days.length; i += 7) {
          const s = days[i], e = days[Math.min(i + 6, days.length - 1)];
          weekGroups.push({ span: Math.min(7, days.length - i), label: `${fmtMD(s)} - ${fmtMD(e)}` });
        }
        const topHTML = weekGroups.map(g => `<div class="pv-gantt-weekcell" style="grid-column: span ${g.span};">${g.label}</div>`).join('');
        const bottomHTML = days.map(d => {
          const cls = ['pv-gantt-daycell'];
          if (isWeekend(d)) cls.push('weekend');
          if (isSameDay(d, today)) cls.push('today-col');
          return `<div class="${cls.join(' ')}">${fmtMDW(d)}</div>`;
        }).join('');
        return { topHTML, bottomHTML };
      }
      if (unit === 'week') {
        const monthGroups = [];
        days.forEach(d => {
          const key = `${d.getFullYear()}-${d.getMonth()}`;
          const last = monthGroups[monthGroups.length - 1];
          if (last && last.key === key) last.span += 1;
          else monthGroups.push({ key, label: `${d.getFullYear()}년 ${d.getMonth() + 1}월`, span: 1 });
        });
        const topHTML = monthGroups.map(g => `<div class="pv-gantt-weekcell month-cell" style="grid-column: span ${g.span};">${g.label}</div>`).join('');
        const weekChunks = [];
        for (let i = 0; i < days.length; i += 7) {
          const s = days[i], e = days[Math.min(i + 6, days.length - 1)];
          const isTodayChunk = today >= s && today <= e;
          weekChunks.push({ span: Math.min(7, days.length - i), label: `${fmtMD(s)}-${fmtMD(e)}`, isToday: isTodayChunk });
        }
        const bottomHTML = weekChunks.map(g => `<div class="pv-gantt-daycell${g.isToday ? ' today-col' : ''}" style="grid-column: span ${g.span};">${g.label}</div>`).join('');
        return { topHTML, bottomHTML };
      }
      const yearGroups = [];
      days.forEach(d => {
        const key = d.getFullYear();
        const last = yearGroups[yearGroups.length - 1];
        if (last && last.key === key) last.span += 1;
        else yearGroups.push({ key, span: 1 });
      });
      const topHTML = yearGroups.map(g => `<div class="pv-gantt-weekcell month-cell" style="grid-column: span ${g.span};">${g.key}년</div>`).join('');
      const monthChunks = [];
      days.forEach(d => {
        const key = `${d.getFullYear()}-${d.getMonth()}`;
        const last = monthChunks[monthChunks.length - 1];
        if (last && last.key === key) last.span += 1;
        else monthChunks.push({ key, label: fmtMonthShort(d), span: 1, isToday: isSameDay(d, today) });
        if (isSameDay(d, today)) monthChunks[monthChunks.length - 1].isToday = true;
      });
      const bottomHTML = monthChunks.map(g => `<div class="pv-gantt-daycell${g.isToday ? ' today-col' : ''}" style="grid-column: span ${g.span};">${g.label}</div>`).join('');
      return { topHTML, bottomHTML };
    }

    let pvPopupEl = null;
    function ensurePvPopup() {
      if (pvPopupEl) return pvPopupEl;
      pvPopupEl = document.createElement('div');
      pvPopupEl.className = 'gantt-popup';
      document.body.appendChild(pvPopupEl);
      return pvPopupEl;
    }
    function showPvPopup(e, r) {
      const popup = ensurePvPopup();
      popup.innerHTML = `
        <div class="popup-title">${escapeHtml(r.tag)} · ${escapeHtml(r.title)}</div>
        <div class="popup-row"><span class="popup-label">담당자</span><span class="popup-value">${escapeHtml(task.owner)}</span></div>
        <div class="popup-row"><span class="popup-label">기간</span><span class="popup-value">${fmtMD(r.startDate)} ~ ${fmtMD(r.endDate)}</span></div>
        <div class="popup-row"><span class="popup-label">진행률</span><span class="popup-value">${r.progress}% · ${r.statusLabel}</span></div>
      `;
      popup.classList.add('visible');
      movePvPopup(e);
    }
    function movePvPopup(e) {
      if (!pvPopupEl) return;
      pvPopupEl.style.left = (e.clientX + 14) + 'px';
      pvPopupEl.style.top = (e.clientY - 20) + 'px';
    }
    function hidePvPopup() { if (pvPopupEl) pvPopupEl.classList.remove('visible'); }

    function renderPvGanttChart() {
      const { rows, dueDate, today } = buildPvGanttRows();
      const { windowStart, windowEnd } = getPvGanttWindow(pvGanttUnit, dueDate);
      const totalDays = diffDays(windowStart, windowEnd) + 1;
      const days = Array.from({ length: totalDays }, (_, i) => addDays(windowStart, i));
      const avClass = ownerColorClass(task.owner);
      const avAbbr = task.owner.slice(0, 1);

      const { topHTML, bottomHTML } = buildPvHeaderRows(pvGanttUnit, days, today);

      const colPx = { day: 54, week: 20, month: 8 }[pvGanttUnit];
      const trackCols = `repeat(${totalDays}, ${colPx}px)`;

      pvGanttView.innerHTML = `
        <div class="pv-gantt-legend">
          <span class="legend-item"><span class="legend-dot legend-dot--progress"></span> 진행중</span>
          <span class="legend-item"><span class="legend-dot legend-dot--done"></span> 종결</span>
          <span class="legend-item"><span class="legend-dot legend-dot--wait"></span> 대기</span>
          <span class="legend-item"><span class="pv-legend-today-line"></span> 오늘</span>
          <span class="pv-legend-hint">← 좌우로 스크롤해서 전체 기간을 확인하세요</span>
        </div>
        <div class="pv-gantt-viewport" id="pv-gantt-viewport">
          <div class="pv-gantt-row pv-gantt-head pv-gantt-head-top">
            <div class="pv-gantt-label">단계</div>
            <div class="pv-gantt-track" style="grid-template-columns: ${trackCols};">${topHTML}</div>
          </div>
          <div class="pv-gantt-row pv-gantt-head pv-gantt-head-bottom">
            <div class="pv-gantt-label"></div>
            <div class="pv-gantt-track" style="grid-template-columns: ${trackCols};">${bottomHTML}</div>
          </div>
          <div class="pv-gantt-rows" id="pv-gantt-rows"></div>
        </div>
        <div class="pv-gantt-foot">기준: 마감일 ${escapeHtml(task.end)} · ${pvGanttUnit === 'day' ? '일' : pvGanttUnit === 'week' ? '주' : '월'} 단위 보기 · 각 단계는 실제 달력에 대응된 절대 일정입니다</div>
      `;

      const rowsEl = pvGanttView.querySelector('#pv-gantt-rows');
      rows.forEach(r => {
        const startIdx = Math.max(0, diffDays(windowStart, r.startDate));
        const endIdx = Math.min(totalDays, diffDays(windowStart, r.endDate) + 1);
        const row = document.createElement('div');
        row.className = 'pv-gantt-row';
        const barStyle = `grid-column: ${startIdx + 1} / ${Math.max(startIdx + 2, endIdx + 1)};`;
        row.innerHTML = `
          <div class="pv-gantt-label">
            <span>${escapeHtml(r.tag)} · ${escapeHtml(r.title)}</span>
          </div>
          <div class="pv-gantt-track" style="grid-template-columns: ${trackCols};">
            <div class="pv-gantt-bar ${r.statusClass}" style="${barStyle}">
              <span class="bar-avatar ${avClass}">${escapeHtml(avAbbr)}</span>
              <span class="bar-name">${escapeHtml(r.title)}</span>
              <span class="bar-progress">${r.progress}%</span>
            </div>
          </div>
        `;
        const bar = row.querySelector('.pv-gantt-bar');
        bar.addEventListener('mouseenter', e => showPvPopup(e, r));
        bar.addEventListener('mousemove', movePvPopup);
        bar.addEventListener('mouseleave', hidePvPopup);
        rowsEl.appendChild(row);
      });

      const viewport = pvGanttView.querySelector('#pv-gantt-viewport');
      const todayIdx = days.findIndex(d => isSameDay(d, today));
      if (todayIdx >= 0) {
        const headEl = viewport.querySelector('.pv-gantt-head-bottom');
        const headerH = viewport.querySelector('.pv-gantt-head-top').offsetHeight + headEl.offsetHeight;
        const line = document.createElement('div');
        line.className = 'pv-gantt-today-line';
        line.style.top = headerH + 'px';
        line.style.left = `${210 + (todayIdx + 0.5) * colPx}px`;
        viewport.appendChild(line);
      }
    }
  })();
  </script>

</body>
</html>
