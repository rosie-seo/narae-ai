<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 · Narae AI</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body class="login-body">

  <main class="login-shell">
    <div class="login-wrap">

      <h1 class="login-logo">
        <img src="/resources/img/component/icon/ico_logo_narae_ai.svg" alt="Narae AI" width="103" height="42">
      </h1>

      <section class="login-card login-card--reset" id="resetCard">

        <header class="login-card__head">
          <p class="login-card__title">비밀번호를 재설정해 주세요</p>
          <p class="login-card__desc" id="resetDesc">
            관리자가 발급한 임시 비밀번호로 로그인했습니다.
          </p>
        </header>

        <!-- 임시 비밀번호 정보 -->
        <div class="krds-table-wrap report-basic reset-info">
          <table class="tbl col data">
            <caption>임시 비밀번호 정보</caption>
            <colgroup><col style="width:34%"><col></colgroup>
            <tbody>
              <tr><th scope="row">계정</th><td id="resetAccount">-</td></tr>
              <tr><th scope="row">발급일</th><td id="resetIssued">-</td></tr>
              <tr><th scope="row">사용 기한</th><td id="resetExpire">-</td></tr>
            </tbody>
          </table>
        </div>

        <!-- 지금 바꿀지 / 나중에 바꿀지 선택 -->
        <div class="reset-choice" id="resetChoice">
          <button type="button" class="krds-btn large primary reset-choice__btn" id="btnChangeNow">지금 변경하기</button>
          <button type="button" class="krds-btn large secondary reset-choice__btn" id="btnChangeLater">나중에 변경</button>
          <p class="reset-choice__hint">나중에 변경하면 다음 로그인 때 다시 안내드립니다. 기한이 지나면 임시 비밀번호로는 로그인할 수 없습니다.</p>
        </div>

        <!-- 새 비밀번호 입력 (지금 변경하기 선택 시) -->
        <form class="reset-form" id="resetForm" hidden>
          <div class="fieldset">

            <div class="form-group">
              <div class="form-tit">
                <label for="newPw">새 비밀번호</label>
              </div>
              <div class="form-conts" id="newPwConts">
                <input type="password" id="newPw" class="krds-input" placeholder="영문·숫자 조합 8자 이상"
                  autocomplete="new-password">
              </div>
              <p class="form-hint" id="newPwHint"></p>
            </div>

            <div class="form-group">
              <div class="form-tit">
                <label for="newPw2">새 비밀번호 확인</label>
              </div>
              <div class="form-conts" id="newPw2Conts">
                <input type="password" id="newPw2" class="krds-input" placeholder="새 비밀번호를 다시 입력해 주세요"
                  autocomplete="new-password">
              </div>
              <p class="form-hint" id="newPw2Hint"></p>
            </div>

          </div>

          <div class="reset-actions">
            <button type="button" class="krds-btn medium text" id="btnBackChoice">뒤로</button>
            <button type="submit" class="krds-btn medium primary" id="btnSavePw">변경 완료</button>
          </div>
        </form>

      </section>

    </div>
  </main>

  <script src="/resources/js/script.js"></script>
  <script>
  (function () {
    const auth = getAuthState();

    // 로그인하지 않은 상태로 들어오면 로그인 화면으로 보낸다
    if (!auth.loggedIn || !auth.loginId) {
      window.location.href = LOGIN_PAGE_URL;
      return;
    }

    const loginId = auth.loginId;
    const me = getCurrentUser();
    const dates = tempPasswordDates(loginId);

    /* ── 안내 정보 ── */
    document.getElementById('resetDesc').textContent =
      '관리자가 발급한 임시 비밀번호로 로그인했습니다. 보안을 위해 새 비밀번호로 바꿔 주세요.';
    document.getElementById('resetAccount').textContent = loginId + ' · ' + me.name + ' ' + me.role + ' (' + me.dept + ')';
    document.getElementById('resetIssued').textContent  = dates.issuedAt;
    document.getElementById('resetExpire').textContent  = dates.expiresAt + ' (발급 후 ' + TEMP_PASSWORD_DAYS + '일)';

    /* ── 지금 / 나중에 선택 ── */
    const choice = document.getElementById('resetChoice');
    const form   = document.getElementById('resetForm');

    document.getElementById('btnChangeNow').addEventListener('click', function () {
      choice.hidden = true;
      form.hidden = false;
      document.getElementById('newPw').focus();
    });

    document.getElementById('btnBackChoice').addEventListener('click', function () {
      form.hidden = true;
      choice.hidden = false;
    });

    document.getElementById('btnChangeLater').addEventListener('click', function () {
      // 변경하지 않고 그대로 진입 — 다음 로그인 때 이 화면이 다시 나온다
      window.location.href = '/index.html';
    });

    /* ── 새 비밀번호 검증 ── */
    function setState(name, state, message) {
      const conts = document.getElementById(name + 'Conts');
      const hint  = document.getElementById(name + 'Hint');
      conts.classList.remove('is-error', 'is-success');
      if (state) conts.classList.add('is-' + state);
      hint.textContent = message || '';
      hint.className = state === 'error' ? 'form-hint-invalid'
                     : state === 'success' ? 'form-hint-success' : 'form-hint';
    }

    const PW_RULE = /^(?=.*[A-Za-z])(?=.*[0-9]).{8,}$/;

    function checkPw(show) {
      const v = document.getElementById('newPw').value;
      if (!v) { if (show) setState('newPw', 'error', '새 비밀번호를 입력해 주세요'); else setState('newPw', null); return false; }
      if (!PW_RULE.test(v)) { setState('newPw', 'error', '영문과 숫자를 포함해 8자 이상으로 입력해 주세요'); return false; }
      if (v === TEST_PASSWORD || v === passwordOf(loginId)) {
        setState('newPw', 'error', '임시 비밀번호와 다른 비밀번호로 설정해 주세요');
        return false;
      }
      setState('newPw', 'success', '사용할 수 있는 비밀번호입니다');
      return true;
    }

    function checkPw2(show) {
      const v1 = document.getElementById('newPw').value;
      const v2 = document.getElementById('newPw2').value;
      if (!v2) { if (show) setState('newPw2', 'error', '새 비밀번호를 다시 입력해 주세요'); else setState('newPw2', null); return false; }
      if (v1 !== v2) { setState('newPw2', 'error', '비밀번호가 일치하지 않습니다'); return false; }
      setState('newPw2', 'success', '비밀번호가 일치합니다');
      return true;
    }

    document.getElementById('newPw').addEventListener('input', function () {
      checkPw(false);
      if (document.getElementById('newPw2').value) checkPw2(false);
    });
    document.getElementById('newPw2').addEventListener('input', function () { checkPw2(false); });

    /* ── 변경 완료 ── */
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const ok1 = checkPw(true);
      const ok2 = checkPw2(true);
      if (!ok1 || !ok2) {
        const first = document.querySelector('.form-conts.is-error input');
        if (first) first.focus();
        return;
      }

      changePassword(loginId, document.getElementById('newPw').value);

      document.getElementById('resetCard').innerHTML = `
        <div class="signup-done">
          <span class="signup-done__icon" aria-hidden="true">&#10003;</span>
          <h1 class="signup-done__title">비밀번호가 변경되었습니다</h1>
          <p class="signup-done__desc">
            다음 로그인부터 새 비밀번호를 사용해 주세요.
          </p>
          <a href="/index.html" class="krds-btn large primary">업무 시스템으로 이동</a>
        </div>
      `;
    });
  })();
  </script>

</body>
</html>
