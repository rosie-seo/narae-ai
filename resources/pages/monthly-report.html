<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월간보고</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script src="/resources/js/component/ui-include.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body data-report-nav="monthly">

  <div class="operating-container">

    <div data-include="/html/code/header.html"></div>

    <div class="organization-container">

      <!-- 사이드 네비게이션 (보고 공통 LNB) -->
      <div data-include="/html/code/report-side-nav.html"></div>

      <!-- 메인 콘텐츠 -->
      <main class="main">

        <div class="page-header">
          <div class="page-title-group">
            <div class="page-title">월간보고</div>
            <div class="page-desc">담당자가 제출한 업무보고를 바탕으로 AI가 작성한 월간보고입니다.</div>
          </div>
          <div class="page-header__actions">
            <a href="/resources/pages/work-report-write.html" class="krds-btn medium secondary">업무보고 작성</a>
          </div>
        </div>

        <!-- 보고 기간 -->
        <div class="report-period">
          <span>보고 기간</span>
          <span class="report-period__range" id="periodRange"></span>
        </div>

        <!-- 내 보고 -->
        <section class="report-section" id="myReportSection" hidden>
          <h2 class="section-title">내 월간보고</h2>
          <ul class="task-list report-list" id="myReportList"></ul>
        </section>

        <!-- 탭 (실별 보기) -->
        <div class="tab-bar" id="teamTabBar"></div>

        <!-- 월간보고 목록 -->
        <ul class="task-list report-list" id="monthlyReportList"></ul>
      </main>

    </div>
  </div>

  <script src="/resources/js/script.js"></script>
  <script>
  (function () {
    // 제출완료된 보고만 노출
    const ALL     = buildMonthlyReports();
    const REPORTS = ALL.filter(r => r.status === 'submitted');

    // 보고 기간 표시
    if (ALL.length) {
      document.getElementById('periodRange').textContent = ALL[0].periodStart + ' ~ ' + ALL[0].periodEnd;
    }

    /* ── 내 보고 (제출 상태와 무관하게 항상 노출) ── */
    const myReport = getMyReport('monthly');
    if (myReport) {
      const sec = document.getElementById('myReportSection');
      const el  = document.getElementById('myReportList');
      sec.hidden = false;
      el.innerHTML = reportCardHTML(myReport);
      el.querySelector('.task-card').addEventListener('click', () => openReport(myReport));
    }

    function openReport(report) {
      sessionStorage.setItem('krds_selected_report', JSON.stringify(report));
      window.location.href = '/resources/pages/weekly-report-detail.html';
    }

    // 실(팀) 단위 탭 · 부서 단위 그룹
    const SIL_NAMES = [...new Set(REPORTS.map(r => r.sil))];
    const tabBar = document.getElementById('teamTabBar');
    const listEl = document.getElementById('monthlyReportList');
    let currentTeam = 'all';

    tabBar.innerHTML = [
      `<button class="tab active" data-team="all">전체 ${REPORTS.length}</button>`,
      ...SIL_NAMES.map(sil => {
        const n = REPORTS.filter(r => r.sil === sil).length;
        return `<button class="tab" data-team="${escapeHtml(sil)}">${escapeHtml(sil)} ${n}</button>`;
      })
    ].join('');

    function groupHTML(g) {
      return `
        <li class="task-group">
          <div class="task-group__head">
            <span class="task-group__name">${escapeHtml(g.dept)}</span>
            <span class="krds-badge small bg-light-gray">${g.reports.length}건</span>
          </div>
          <ul class="task-list task-list--nested">
            ${g.reports.map(reportCardHTML).join('')}
          </ul>
        </li>
      `;
    }

    function render() {
      let flatReports;

      if (currentTeam === 'all') {
        // 전체: 실 구분 없이 보고 일자 기준으로 정렬한 단일 목록
        flatReports = [...REPORTS].sort((a, b) => a.submittedAt.localeCompare(b.submittedAt));
        listEl.classList.remove('task-list--grouped');
        listEl.innerHTML = flatReports.length
          ? flatReports.map(reportCardHTML).join('')
          : '<li class="task-empty">제출완료된 월간보고가 없습니다.</li>';
      } else {
        // 특정 실: 부서 단위로 묶어서 표시
        const scoped = REPORTS.filter(r => r.sil === currentTeam);
        const depts  = [...new Set(scoped.map(r => r.dept))];
        const groups = depts.map(dept => ({ dept, reports: scoped.filter(r => r.dept === dept) }));
        flatReports = groups.flatMap(g => g.reports);
        listEl.classList.add('task-list--grouped');
        listEl.innerHTML = groups.length
          ? groups.map(groupHTML).join('')
          : '<li class="task-empty">제출완료된 월간보고가 없습니다.</li>';
      }

      listEl.querySelectorAll('.task-card').forEach((card, i) => {
        card.addEventListener('click', () => openReport(flatReports[i]));
      });
    }

    tabBar.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        tabBar.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTeam = btn.dataset.team;
        render();
      });
    });

    render();
  })();
  </script>

</body>
</html>
