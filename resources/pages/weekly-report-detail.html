<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주간보고 상세</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script src="/resources/js/component/ui-include.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body>

  <div class="operating-container">

    <div data-include="/html/code/header.html"></div>

    <div class="organization-container">

      <!-- 사이드 네비게이션 -->
      <nav class="side-nav" aria-label="주간보고 상세 네비게이션">
        <ul class="nav-tree" role="list">
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <a href="/resources/pages/weekly-report.html" class="nav-node__row" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">주간보고 목록</span>
            </a>
          </li>
          <li class="nav-node nav-node--leaf nav-node--depth0">
            <span class="nav-node__row is-selected" style="--depth: 0">
              <span class="nav-node__caret"></span>
              <span class="nav-node__label">보고 상세</span>
            </span>
          </li>
        </ul>
      </nav>

      <!-- 메인 콘텐츠 -->
      <main class="main" style="padding:0; overflow:auto;">

        <!-- 보고 정보 헤더 -->
        <header class="gnb-sub">
          <div class="task-id">
            <span class="krds-badge bg-light-gray" id="report-badge">제출완료</span>
            <div class="task-titles">
              <strong class="task-name" id="report-title">부서명 주간보고</strong>
              <span class="task-meta" id="report-meta">작성자 · 보고기간</span>
            </div>
            <span class="chevron" aria-hidden="true">&rsaquo;</span>
          </div>
          <button type="button" class="btn-log" onclick="history.back()">
            <span class="ico" aria-hidden="true">&#8592;</span> 목록으로
          </button>
        </header>

        <div class="layout" style="grid-template-columns: minmax(0,1fr);">
          <div>

            <!-- 요약 -->
            <section style="margin-bottom: 32px;">
              <h2 class="section-title" style="margin-bottom: 12px;">보고 요약</h2>
              <div class="report-summary" id="report-summary"></div>
            </section>

            <!-- 업무 추진현황 -->
            <section style="margin-bottom: 32px;">
              <h2 class="section-title" style="margin-bottom: 12px;">업무 추진현황</h2>
              <ul class="task-list" id="report-tasks"></ul>
            </section>

            <!-- 일일 업무일지 -->
            <section>
              <h2 class="section-title" style="margin-bottom: 12px;">일일 업무일지</h2>
              <div class="daily-log" id="report-daily"></div>
            </section>

          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/resources/js/script.js"></script>
  <script>
  (function () {
    const raw = sessionStorage.getItem('krds_selected_report');
    const content = document.querySelector('.layout');

    if (!raw) {
      content.innerHTML = '<p style="padding:24px;color:var(--krds-light-color-text-disabled)">보고 정보가 없습니다.</p>';
      return;
    }

    const report = JSON.parse(raw);

    /* ── 헤더 채우기 ── */
    const badge = document.getElementById('report-badge');
    badge.textContent = REPORT_STATUS_LABEL[report.status] || report.status;
    badge.className   = REPORT_STATUS_CLASS[report.status] || 'krds-badge bg-light-gray';
    document.getElementById('report-title').textContent = report.dept + ' 주간보고';
    document.title = report.dept + ' 주간보고 상세';
    document.getElementById('report-meta').textContent =
      report.author + ' ' + report.authorRole + ' · ' + report.sil + ' · ' + report.weekStart + ' ~ ' + report.weekEnd;

    /* ── 요약 ── */
    document.getElementById('report-summary').innerHTML = `
      <div class="report-summary__row">
        <div class="report-summary__stat"><span class="report-summary__num">${report.memberCount}</span><span class="report-summary__label">소속 인원</span></div>
        <div class="report-summary__stat"><span class="report-summary__num">${report.totalCount}</span><span class="report-summary__label">전체 업무</span></div>
        <div class="report-summary__stat"><span class="report-summary__num">${report.doneCount}</span><span class="report-summary__label">완료</span></div>
        <div class="report-summary__stat"><span class="report-summary__num">${report.progressCount}</span><span class="report-summary__label">진행중</span></div>
      </div>
      <p class="report-summary__text">
        ${escapeHtml(report.dept)}는 이번 주(${report.weekStart} ~ ${report.weekEnd}) 총 ${report.totalCount}건의 업무를 진행했으며,
        그중 ${report.doneCount}건을 완료했습니다. 보고 상태는 <strong>${REPORT_STATUS_LABEL[report.status]}</strong>입니다.
      </p>
    `;

    /* ── 업무 추진현황 (실제 업무 카드 재사용) ── */
    const taskListEl = document.getElementById('report-tasks');
    if (report.tasks.length) {
      taskListEl.innerHTML = report.tasks.map(taskCardHTML).join('');
      taskListEl.querySelectorAll('.task-card').forEach((card, i) => {
        card.addEventListener('click', () => {
          sessionStorage.setItem('krds_selected_task', JSON.stringify(report.tasks[i]));
          window.location.href = '/resources/pages/operating-detail.html';
        });
      });
    } else {
      taskListEl.innerHTML = '<li class="task-empty">등록된 업무가 없습니다.</li>';
    }

    /* ── 일일 업무일지 (업무를 요일별로 결정적으로 배분해 요약 생성) ── */
    const DAY_NAMES = ['월요일', '화요일', '수요일', '목요일', '금요일'];
    const weekStartDate = new Date(report.weekStart);
    const days = DAY_NAMES.map((name, i) => {
      const d = new Date(weekStartDate);
      d.setDate(d.getDate() + i);
      return { name, date: (d.getMonth() + 1) + '.' + String(d.getDate()).padStart(2, '0'), items: [] };
    });
    report.tasks.forEach((t, i) => {
      const label = t.title + ' — ' + STATUS_LABEL[t.status];
      days[i % 5].items.push(label);
    });

    document.getElementById('report-daily').innerHTML = days.map(d => `
      <div class="day-col">
        <div class="day-col__head"><span class="day-col__name">${d.name}</span><span class="day-col__date">${d.date}</span></div>
        <ul class="day-col__list">
          ${d.items.length ? d.items.map(t => `<li>${escapeHtml(t)}</li>`).join('') : '<li class="day-col__empty">특이사항 없음</li>'}
        </ul>
      </div>
    `).join('');
  })();
  </script>

</body>
</html>
