<script src="/resources/js/script.js"></script>
<script>
function toggleTeamDropdown(btn) {
  const dd = document.getElementById('filterTeamDd');
  dd.classList.toggle('visible');
  if (dd.classList.contains('visible')) {
    const r = btn.getBoundingClientRect();
    dd.style.left = r.left + 'px';
    dd.style.top  = (r.bottom + 4) + 'px';
  }
}
function selectFilterTeam(el, value) {
  document.querySelectorAll('#filterTeamDd .dropdown-item').forEach(i => i.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('filterTeamBtn').textContent = value || '팀 선택';
  document.getElementById('filterTeamDd').classList.remove('visible');
  const sel = document.getElementById('filterTeam');
  sel.value = value;
  sel.dispatchEvent(new Event('change'));
}
document.addEventListener('click', e => {
  if (!e.target.closest('#filterTeamDd') && e.target.id !== 'filterTeamBtn')
    document.getElementById('filterTeamDd')?.classList.remove('visible');
});
</script>
