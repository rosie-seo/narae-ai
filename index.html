<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/resources/css/custom.css">
    <link href="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.css" type="text/css" rel="stylesheet" />
    <script src="/resources/js/component/ui-include.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/krds-uiux@1.0.3/resources/cdn/krds.min.js"></script>
</head>
<body>
    <div data-include="/html/code/header.html"></div>

<div class="board" id="orgBoard">
  <div class="columns" id="columns"></div>
  <div class="main" id="main"></div>
</div>

<script src="/resources/js/script.js"></script>
<script>
/* 조직/업무 데이터는 /resources/js/script.js의 공유 ORG를 그대로 사용합니다
   (조직도 · 업무 테이블 · 업무 차트와 동일한 데이터 소스). */

/* ===================== 상태 ===================== */
let path = [];          // 선택된 org 노드 배열
let selectedWorker = null;
let openTask = null;    // 현재 열려있는 업무(워크플로우 보기)
let flowZoom = 1;
let flowPanX = 40;
let flowPanY = 30;
let taskGroupOpen = { regular: true, irregular: true }; // 정기/비정기 업무 그룹 펼침 상태

const columnsEl = document.getElementById("columns");
const mainEl = document.getElementById("main");

/* 업무명을 시드로 정기/비정기 업무를 결정적으로 구분 (표시 전용, 실제 업무 데이터와는 연계하지 않음) */
function isRegularTask(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (Math.imul(31, h) + title.charCodeAt(i)) | 0;
  return (Math.abs(h) % 3) === 0;
}

function currentLevelItems() {
  if (path.length === 0) return { items: ORG, kind: "org" };
  const last = path[path.length - 1];
  if (last.children && last.children.length) return { items: last.children, kind: "org" };
  return { items: last.members || [], kind: "worker" };
}

function render() {
  columnsEl.innerHTML = "";

  // 1) 이미 선택된 조상들 -> 좁은 컬럼
  path.forEach((node, idx) => {
    const col = document.createElement("div");
    col.className = "col-narrow";
    col.title = "다시 선택하려면 클릭";
    col.innerHTML = `<span>${node.name}</span>`;
    col.onclick = () => {
      path = path.slice(0, idx);
      selectedWorker = null;
      openTask = null;
      render();
    };
    columnsEl.appendChild(col);
  });

  // 2) 현재 프론티어 -> 넓은 컬럼
  const { items, kind } = currentLevelItems();
  const wide = document.createElement("div");
  wide.className = "col-wide";

  let headerLabel;
  if (path.length === 0) {
    headerLabel = "조직 (1depth)";
  } else if (kind === "worker") {
    headerLabel = "소속 근무자";
  } else {
    headerLabel = "하위 조직";
  }

  wide.innerHTML = `
    <div class="col-header">${headerLabel}</div>
    <div class="col-divider"></div>
    <div class="col-rows" id="col-rows"></div>
  `;
  columnsEl.appendChild(wide);

  const rowsEl = wide.querySelector("#col-rows");
  items.forEach(item => {
    const row = document.createElement("div");
    row.className = "row";
    if (kind === "worker" && selectedWorker === item) row.classList.add("selected");

    if (kind === "worker") {
      row.innerHTML = `
        <span class="name">${escapeHtml(item.name)}</span>
        <span class="meta">${escapeHtml(item.role)}</span>
        <span class="arrow">›</span>
      `;
      row.onclick = () => {
        selectedWorker = item;
        openTask = null;
        render();
      };
    } else {
      row.innerHTML = `
        <span class="name">${escapeHtml(item.name)}</span>
        <span class="meta">${item.head}명</span>
        <span class="arrow">›</span>
      `;
      row.onclick = () => {
        path = [...path, item];
        selectedWorker = null;
        openTask = null;
        render();
      };
    }
    rowsEl.appendChild(row);
  });

  // 3) 근무자가 선택되어 있으면 -> 업무 리스트를 얇은 컬럼으로 옆에 표시
  if (kind === "worker" && selectedWorker) {
    const taskCol = document.createElement("div");
    taskCol.className = "col-wide col-slim";
    taskCol.innerHTML = `
      <div class="col-header">업무 목록</div>
      <div class="col-divider"></div>
      <div class="col-rows" id="task-rows"></div>
    `;
    columnsEl.appendChild(taskCol);
    const taskRowsEl = taskCol.querySelector("#task-rows");
    const leaf = path[path.length - 1];
    const myTasks = (leaf.tasks || []).filter(t => t.owner === selectedWorker.name);
    const regularTasks = myTasks.filter(t => isRegularTask(t.title));
    const irregularTasks = myTasks.filter(t => !isRegularTask(t.title));

    function renderTaskRow(t) {
      const tr = document.createElement("div");
      tr.className = "task-row" + (openTask === t ? " selected" : "");
      tr.innerHTML = `
        <span class="dot status-${t.status}"></span>
        <div class="task-info">
          <div class="t-name">${escapeHtml(t.title)}</div>
          <div class="t-due">${STATUS_LABEL[t.status]} · 마감 ${fmtDue(t.end)}</div>
        </div>
      `;
      tr.onclick = () => {
        openTask = t;
        flowZoom = 1; flowPanX = 40; flowPanY = 30;
        flowViewMode = "node";
        ganttUnit = "day";
        render();
      };
      return tr;
    }

    function renderTaskGroup(key, label, tasks) {
      const isOpen = taskGroupOpen[key];
      const group = document.createElement("div");
      group.className = "task-group" + (isOpen ? "" : " collapsed");
      const labelEl = document.createElement("div");
      labelEl.className = "task-group__label";
      labelEl.innerHTML = `
        <span class="task-group__caret">${isOpen ? "▾" : "▸"}</span>
        <span class="task-group__text">${label}</span>
        <span class="task-group__count">${tasks.length}</span>
      `;
      labelEl.onclick = () => {
        taskGroupOpen[key] = !taskGroupOpen[key];
        render();
      };
      group.appendChild(labelEl);

      if (isOpen) {
        if (!tasks.length) {
          const empty = document.createElement("div");
          empty.className = "task-empty";
          empty.textContent = "등록된 업무가 없습니다.";
          group.appendChild(empty);
        } else {
          tasks.forEach(t => group.appendChild(renderTaskRow(t)));
        }
      }
      taskRowsEl.appendChild(group);
    }

    renderTaskGroup("regular", "정기 업무", regularTasks);
    renderTaskGroup("irregular", "비정기 업무", irregularTasks);
  }

  renderMain();
}

function renderMain() {
  mainEl.innerHTML = "";
  if (!selectedWorker) {
    const ph = document.createElement("div");
    ph.className = "placeholder";
    ph.innerHTML = `
      <div class="line1">조직을 클릭해 탐색을 시작하세요</div>
      <div class="line2">하위 조직 → 근무자 → 담당 업무 → 워크플로우 순서로 펼쳐집니다.</div>
    `;
    mainEl.appendChild(ph);
    return;
  }
  if (!openTask) {
    const ph = document.createElement("div");
    ph.className = "placeholder";
    ph.innerHTML = `
      <div class="line1">${selectedWorker.name}님의 업무를 선택하세요</div>
      <div class="line2">왼쪽 업무 목록에서 항목을 클릭하면 처리 워크플로우가 전체 화면에 표시됩니다.</div>
    `;
    mainEl.appendChild(ph);
    return;
  }
  renderFlow(selectedWorker, openTask);
}

/* ===================== 워크플로우(React Flow 스타일) ===================== */
function buildWorkflow(worker, task) {
  const doneChain = task.status === "done";
  const nodes = [
    { id: "n1", x: 20,  y: 150, type: "node-start",   tag: "시작", title: task.title, sub: "업무 등록" },
    { id: "n2", x: 250, y: 150, type: "node-normal",  tag: "처리", title: `${worker.name} (${worker.role})`, sub: "담당자 처리" },
    { id: "n3", x: 500, y: 40,  type: "node-normal",  tag: "협의", title: "팀장 협의", sub: "내부 검토" },
    { id: "n4", x: 500, y: 260, type: "node-branch",  tag: "협조", title: "관계부서 협조", sub: "타 부서 의견조회" },
    { id: "n5", x: 750, y: 150, type: "node-branch",  tag: "상신", title: "결재 상신", sub: "전자결재 시스템" },
    { id: "n6", x: 1000,y: 40,  type: "node-reject",  tag: "반려", title: "반려", sub: "보완 후 재상신" },
    { id: "n7", x: 1000,y: 260, type: "node-approve", tag: "승인", title: "결재 완료", sub: "최종 승인" },
    { id: "n8", x: 1220,y: 150, type: doneChain ? "node-end" : "node-normal", tag: doneChain ? "완료" : "예정", title: "시행", sub: doneChain ? "업무 종료" : "시행 대기" },
  ];
  const edges = [
    { from: "n1", to: "n2" },
    { from: "n2", to: "n3" },
    { from: "n2", to: "n4" },
    { from: "n3", to: "n5" },
    { from: "n4", to: "n5" },
    { from: "n5", to: "n6", dashed: true, color: "#e0432b" },
    { from: "n5", to: "n7", color: "#2fa84f" },
    { from: "n6", to: "n2", dashed: true, color: "#e0432b", loop: true },
    { from: "n7", to: "n8" },
  ];
  return { nodes, edges };
}

function nodePort(n, side) {
  const w = 170, h = 54;
  return side === "right" ? { x: n.x + w, y: n.y + h / 2 } : { x: n.x, y: n.y + h / 2 };
}

function edgePath(nodes, edge) {
  const from = nodes.find(n => n.id === edge.from);
  const to = nodes.find(n => n.id === edge.to);
  const p1 = nodePort(from, "right");
  const p2 = edge.loop ? nodePort(to, "left") : nodePort(to, to.x >= from.x ? "left" : "right");
  if (edge.loop) {
    // 반려 -> 담당자 처리로 되돌아가는 곡선 (위로 크게 우회)
    const midY = Math.min(p1.y, p2.y) - 140;
    return `M ${p1.x} ${p1.y} C ${p1.x} ${midY}, ${p2.x} ${midY}, ${p2.x} ${p2.y}`;
  }
  const dx = Math.max(Math.abs(p2.x - p1.x) * 0.5, 40);
  return `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
}

let flowViewMode = "node"; // "node" | "gantt"

function parseISODate(iso) {
  // "2026-07-15" -> local Date, avoids UTC off-by-one
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtDue(iso) {
  const d = parseISODate(iso);
  return `${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`;
}
function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}
function isSameDay(a, b) { return a.toDateString() === b.toDateString(); }
function isWeekend(d) { const w = d.getDay(); return w === 0 || w === 6; }
function fmtMD(date) { return `${date.getMonth() + 1}/${date.getDate()}`; }
function fmtMDW(date) { const w = ["일","월","화","수","목","금","토"][date.getDay()]; return `${date.getDate()} (${w})`; }

function diffDays(a, b) { return Math.round((b - a) / 86400000); }
function fmtMonthShort(date) { return `${date.getMonth() + 1}월`; }
function fmtYear(date) { return `${date.getFullYear()}년`; }

function buildGanttRows(nodes, task) {
  // 메인 경로 단계의 실제 날짜(마감일 기준 2주 타임라인)를 한 번만 계산 — 뷰 단위와 무관하게 고정
  const order = ["n1", "n2", "n3", "n4", "n5", "n7", "n8"];
  const ranges = {
    n1: [0, 1], n2: [1, 4], n3: [4, 6], n4: [4, 6],
    n5: [6, 7], n7: [7, 8], n8: [8, 9],
  };
  const TOTAL_UNITS = 9;
  const TASK_SPAN_DAYS = 14; // 업무 자체의 실제 소요 기간(고정)
  const dueDate = parseISODate(task.end);
  const taskStart = addDays(dueDate, -(TASK_SPAN_DAYS - 1));
  const today = new Date();

  const rows = order.map(id => {
    const n = nodes.find(x => x.id === id);
    const [su, eu] = ranges[id];
    const startOff = Math.round((su / TOTAL_UNITS) * (TASK_SPAN_DAYS - 1));
    const endOff = Math.max(startOff + 1, Math.round((eu / TOTAL_UNITS) * (TASK_SPAN_DAYS - 1)));
    const stepStart = addDays(taskStart, startOff);
    const stepEnd = addDays(taskStart, Math.min(endOff, TASK_SPAN_DAYS - 1));

    let progress = 0, statusClass = "bar-gray", statusLabel = STATUS_LABEL.wait;
    if (task.status === "done") { progress = 100; statusClass = "bar-green"; statusLabel = STATUS_LABEL.done; }
    else if (task.status === "wait") { progress = 0; statusClass = "bar-gray"; statusLabel = STATUS_LABEL.wait; }
    else { // progress
      if (today > stepEnd) { progress = 100; statusClass = "bar-green"; statusLabel = STATUS_LABEL.done; }
      else if (today >= stepStart && today <= stepEnd) { progress = 50; statusClass = "bar-blue"; statusLabel = STATUS_LABEL.progress; }
      else { progress = 0; statusClass = "bar-gray"; statusLabel = STATUS_LABEL.wait; }
    }

    return { ...n, startDate: stepStart, endDate: stepEnd, progress, statusClass, statusLabel };
  });

  return { rows, dueDate, taskStart, today };
}

/* 일/주/월 선택에 따른 표시 윈도우(범위) 계산 */
function getGanttWindow(unit, dueDate) {
  if (unit === "day") {
    const windowEnd = addDays(dueDate, 3);
    return { windowStart: addDays(windowEnd, -20), windowEnd };
  }
  if (unit === "week") {
    const windowEnd = addDays(dueDate, 14);
    return { windowStart: addDays(windowEnd, -69), windowEnd };
  }
  // month
  const windowEnd = addDays(dueDate, 30);
  return { windowStart: addDays(windowEnd, -209), windowEnd };
}

function buildHeaderRows(unit, days, today) {
  if (unit === "day") {
    const weekGroups = [];
    for (let i = 0; i < days.length; i += 7) {
      const s = days[i], e = days[Math.min(i + 6, days.length - 1)];
      weekGroups.push({ span: Math.min(7, days.length - i), label: `${fmtMD(s)} - ${fmtMD(e)}` });
    }
    const topHTML = weekGroups.map(g => `<div class="gantt-weekcell" style="grid-column: span ${g.span};">${g.label}</div>`).join("");
    const bottomHTML = days.map(d => {
      const cls = ["gantt-daycell"];
      if (isWeekend(d)) cls.push("weekend");
      if (isSameDay(d, today)) cls.push("today-col");
      return `<div class="${cls.join(" ")}">${fmtMDW(d)}</div>`;
    }).join("");
    return { topHTML, bottomHTML };
  }

  if (unit === "week") {
    // 상단: 월 그룹 / 하단: 7일 단위 구간
    const monthGroups = [];
    days.forEach(d => {
      const key = `${d.getFullYear()}-${d.getMonth()}`;
      const last = monthGroups[monthGroups.length - 1];
      if (last && last.key === key) last.span += 1;
      else monthGroups.push({ key, label: `${d.getFullYear()}년 ${d.getMonth() + 1}월`, span: 1 });
    });
    const topHTML = monthGroups.map(g => `<div class="gantt-weekcell month-cell" style="grid-column: span ${g.span};">${g.label}</div>`).join("");

    const weekChunks = [];
    for (let i = 0; i < days.length; i += 7) {
      const s = days[i], e = days[Math.min(i + 6, days.length - 1)];
      const isTodayChunk = today >= s && today <= e;
      weekChunks.push({ span: Math.min(7, days.length - i), label: `${fmtMD(s)}-${fmtMD(e)}`, isToday: isTodayChunk });
    }
    const bottomHTML = weekChunks.map(g => `<div class="gantt-daycell${g.isToday ? " today-col" : ""}" style="grid-column: span ${g.span};">${g.label}</div>`).join("");
    return { topHTML, bottomHTML };
  }

  // month
  const yearGroups = [];
  days.forEach(d => {
    const key = d.getFullYear();
    const last = yearGroups[yearGroups.length - 1];
    if (last && last.key === key) last.span += 1;
    else yearGroups.push({ key, span: 1 });
  });
  const topHTML = yearGroups.map(g => `<div class="gantt-weekcell month-cell" style="grid-column: span ${g.span};">${g.key}년</div>`).join("");

  const monthChunks = [];
  days.forEach(d => {
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const last = monthChunks[monthChunks.length - 1];
    if (last && last.key === key) last.span += 1;
    else monthChunks.push({ key, label: fmtMonthShort(d), span: 1, isToday: isSameDay(d, today) });
    if (isSameDay(d, today)) monthChunks[monthChunks.length - 1].isToday = true;
  });
  const bottomHTML = monthChunks.map(g => `<div class="gantt-daycell${g.isToday ? " today-col" : ""}" style="grid-column: span ${g.span};">${g.label}</div>`).join("");
  return { topHTML, bottomHTML };
}

function renderGanttChart(host, worker, task, nodes) {
  const { rows, dueDate, today } = buildGanttRows(nodes, task);
  const { windowStart, windowEnd } = getGanttWindow(ganttUnit, dueDate);
  const totalDays = diffDays(windowStart, windowEnd) + 1;
  const days = Array.from({ length: totalDays }, (_, i) => addDays(windowStart, i));
  const avClass = ownerColorClass(worker.name);
  const avAbbr = worker.name.slice(0, 1);

  const { topHTML, bottomHTML } = buildHeaderRows(ganttUnit, days, today);

  const colPx = { day: 54, week: 20, month: 8 }[ganttUnit];
  const trackCols = `repeat(${totalDays}, ${colPx}px)`;

  host.innerHTML = `
    <div class="gantt-legend">
      <span class="legend-item"><span class="legend-dot legend-dot--progress"></span> 진행중</span>
      <span class="legend-item"><span class="legend-dot legend-dot--done"></span> 종결</span>
      <span class="legend-item"><span class="legend-dot legend-dot--wait"></span> 대기</span>
      <span class="legend-item"><span class="legend-today-line"></span> 오늘</span>
      <span class="legend-hint">← 좌우로 스크롤해서 전체 기간을 확인하세요</span>
    </div>
    <div class="gantt-viewport" id="gantt-viewport">
      <div class="gantt-row gantt-head gantt-head-top">
        <div class="gantt-label">단계</div>
        <div class="gantt-track" style="grid-template-columns: ${trackCols};">${topHTML}</div>
      </div>
      <div class="gantt-row gantt-head gantt-head-bottom">
        <div class="gantt-label"></div>
        <div class="gantt-track" style="grid-template-columns: ${trackCols};">${bottomHTML}</div>
      </div>
      <div class="gantt-rows" id="gantt-rows"></div>
    </div>
    <div class="gantt-foot">기준: 마감일 ${fmtDue(task.end)} · ${ganttUnit === "day" ? "일" : ganttUnit === "week" ? "주" : "월"} 단위 보기 · 각 단계는 실제 달력에 대응된 절대 일정입니다</div>
  `;

  const rowsEl = host.querySelector("#gantt-rows");
  rows.forEach(r => {
    const startIdx = Math.max(0, diffDays(windowStart, r.startDate));
    const endIdx = Math.min(totalDays, diffDays(windowStart, r.endDate) + 1);
    const row = document.createElement("div");
    row.className = "gantt-row";
    const barStyle = `grid-column: ${startIdx + 1} / ${Math.max(startIdx + 2, endIdx + 1)};`;
    row.innerHTML = `
      <div class="gantt-label">
        <span>${r.tag} · ${r.title}</span>
      </div>
      <div class="gantt-track" style="grid-template-columns: ${trackCols};">
        <div class="gantt-bar ${r.statusClass}" style="${barStyle}">
          <span class="bar-avatar ${avClass}">${avAbbr}</span>
          <span class="bar-name">${r.title}</span>
          <span class="bar-progress">${r.progress}%</span>
        </div>
      </div>
    `;
    const bar = row.querySelector(".gantt-bar");
    bar.addEventListener("mouseenter", (e) => showGanttPopup(e, r, worker));
    bar.addEventListener("mousemove", moveGanttPopup);
    bar.addEventListener("mouseleave", hideGanttPopup);
    rowsEl.appendChild(row);
  });

  // 오늘 세로선
  const viewport = host.querySelector("#gantt-viewport");
  const todayIdx = days.findIndex(d => isSameDay(d, today));
  if (todayIdx >= 0) {
    const headEl = viewport.querySelector(".gantt-head-bottom");
    const headerH = viewport.querySelector(".gantt-head-top").offsetHeight + headEl.offsetHeight;
    const line = document.createElement("div");
    line.className = "gantt-today-line";
    line.style.top = headerH + "px";
    line.style.left = `${210 + (todayIdx + 0.5) * colPx}px`;
    viewport.appendChild(line);
  }
}

/* 간트 바 툴팁 팝업 */
let ganttPopupEl = null;
function ensureGanttPopup() {
  if (ganttPopupEl) return ganttPopupEl;
  ganttPopupEl = document.createElement("div");
  ganttPopupEl.className = "gantt-popup";
  document.getElementById("orgBoard").appendChild(ganttPopupEl);
  return ganttPopupEl;
}
function showGanttPopup(e, r, worker) {
  const popup = ensureGanttPopup();
  popup.innerHTML = `
    <div class="popup-title">${r.tag} · ${r.title}</div>
    <div class="popup-row"><span class="popup-label">담당자</span><span class="popup-value">${worker.name} (${worker.role})</span></div>
    <div class="popup-row"><span class="popup-label">기간</span><span class="popup-value">${fmtMD(r.startDate)} ~ ${fmtMD(r.endDate)}</span></div>
    <div class="popup-row"><span class="popup-label">진행률</span><span class="popup-value">${r.progress}% · ${r.statusLabel}</span></div>
  `;
  popup.classList.add("visible");
  moveGanttPopup(e);
}
function moveGanttPopup(e) {
  if (!ganttPopupEl) return;
  ganttPopupEl.style.left = (e.clientX + 14) + "px";
  ganttPopupEl.style.top = (e.clientY - 20) + "px";
}
function hideGanttPopup() {
  if (ganttPopupEl) ganttPopupEl.classList.remove("visible");
}

let ganttUnit = "day"; // "day" | "week" | "month" — 노드 뷰에서는 줌 프리셋으로 사용
const NODE_ZOOM_PRESET = { day: 1.3, week: 1, month: 0.6 };

/* ===================== 목표 대비 진척률 분석 ===================== */
function computeGoalAnalysis(task) {
  const start = parseISODate(task.start);
  const end = parseISODate(task.end);
  const today = new Date();
  const totalSpan = Math.max(1, diffDays(start, end));
  const elapsed = Math.min(totalSpan, Math.max(0, diffDays(start, today)));
  const targetPct = Math.round((elapsed / totalSpan) * 100);

  let actualPct;
  if (task.status === "done") {
    actualPct = 100;
  } else if (task.status === "wait") {
    actualPct = 0;
  } else {
    // 업무명을 시드로 한 결정적 의사난수 — 같은 업무는 항상 같은 편차
    let h = 0;
    for (let i = 0; i < task.title.length; i++) h = (Math.imul(31, h) + task.title.charCodeAt(i)) | 0;
    const offset = (Math.abs(h) % 31) - 15; // -15 ~ +15
    actualPct = Math.min(96, Math.max(4, targetPct + offset));
  }

  const diff = actualPct - targetPct;
  let statusLabel, statusClass;
  if (task.status === "done") { statusLabel = "목표 달성"; statusClass = "goal-ok"; }
  else if (diff <= -8) { statusLabel = "목표 대비 지연"; statusClass = "goal-behind"; }
  else if (diff >= 8) { statusLabel = "목표 초과 달성"; statusClass = "goal-ahead"; }
  else { statusLabel = "목표대로 진행중"; statusClass = "goal-ok"; }

  return { targetPct, actualPct, diff, statusLabel, statusClass };
}

function renderGoalAnalysis(task) {
  const g = computeGoalAnalysis(task);
  const diffText = g.diff === 0
    ? "실제 진척률이 목표와 동일합니다."
    : g.diff > 0
      ? `실제 진척률이 목표보다 ${g.diff}%p 앞서 있습니다.`
      : `실제 진척률이 목표보다 ${Math.abs(g.diff)}%p 뒤처져 있습니다.`;
  return `
    <div class="goal-analysis">
      <div class="goal-analysis__head">
        <span class="goal-analysis__title">목표 대비 진척률 분석</span>
        <span class="goal-analysis__badge ${g.statusClass}">${g.statusLabel}</span>
      </div>
      <div class="goal-analysis__metrics">
        <div class="goal-metric">
          <div class="goal-metric__label">목표 진척률 <span class="goal-metric__hint">(마감 ${fmtDue(task.end)} 기준 경과율)</span></div>
          <div class="goal-metric__bar"><div class="goal-metric__fill goal-metric__fill--target" style="width:${g.targetPct}%"></div></div>
          <div class="goal-metric__value">${g.targetPct}%</div>
        </div>
        <div class="goal-metric">
          <div class="goal-metric__label">실제 진척률</div>
          <div class="goal-metric__bar"><div class="goal-metric__fill goal-metric__fill--actual" style="width:${g.actualPct}%"></div></div>
          <div class="goal-metric__value">${g.actualPct}%</div>
        </div>
      </div>
      <div class="goal-analysis__note">${diffText}</div>
    </div>
  `;
}

function renderFlow(worker, task) {
  const { nodes, edges } = buildWorkflow(worker, task);

  const wrap = document.createElement("div");
  wrap.className = "flow-wrap";
  wrap.innerHTML = `
    <div class="flow-header">
      <button class="back-btn" id="flow-back">← 업무 목록</button>
      <span class="flow-title">${escapeHtml(task.title)}</span>
      <span class="${STATUS_CLASS[task.status]}">${STATUS_LABEL[task.status]}</span>
      <div class="flow-toolbars">
        <div class="view-toggle">
          <button class="vt-btn" data-mode="node">노드</button>
          <button class="vt-btn" data-mode="gantt">간트 차트</button>
        </div>
        <div class="unit-toggle">
          <button class="vt-btn" data-unit="day">일</button>
          <button class="vt-btn" data-unit="week">주</button>
          <button class="vt-btn" data-unit="month">월</button>
        </div>
      </div>
    </div>
    <div class="flow-sub">${worker.name} · ${worker.role} 담당 · 처리 워크플로우</div>
    <div class="flow-body" id="flow-body"></div>
    ${renderGoalAnalysis(task)}
  `;
  mainEl.appendChild(wrap);

  wrap.querySelector("#flow-back").onclick = () => { openTask = null; render(); };

  wrap.querySelectorAll(".vt-btn[data-mode]").forEach(btn => {
    btn.onclick = () => {
      flowViewMode = btn.dataset.mode;
      renderFlowBody();
    };
  });
  wrap.querySelectorAll(".vt-btn[data-unit]").forEach(btn => {
    btn.onclick = () => {
      ganttUnit = btn.dataset.unit;
      if (flowViewMode === "node") {
        flowZoom = NODE_ZOOM_PRESET[ganttUnit];
        flowPanX = 40; flowPanY = 30;
      }
      renderFlowBody();
    };
  });

  const body = wrap.querySelector("#flow-body");

  function renderFlowBody() {
    wrap.querySelectorAll(".vt-btn[data-mode]").forEach(b => b.classList.toggle("active", b.dataset.mode === flowViewMode));
    wrap.querySelectorAll(".vt-btn[data-unit]").forEach(b => b.classList.toggle("active", b.dataset.unit === ganttUnit));
    body.innerHTML = "";
    if (flowViewMode === "node") {
      renderNodeCanvas(body, nodes, edges);
    } else {
      renderGanttChart(body, worker, task, nodes);
    }
  }

  renderFlowBody();
}

function renderNodeCanvas(host, nodes, edges) {
  host.innerHTML = `
    <div class="flow-viewport" id="flow-viewport">
      <div class="flow-world" id="flow-world">
        <svg class="flow-edges" id="flow-edges"></svg>
      </div>
      <div class="flow-controls">
        <button id="fz-in">+</button>
        <button id="fz-out">−</button>
        <button id="fz-fit">⤢</button>
      </div>
    </div>
  `;

  const world = host.querySelector("#flow-world");
  const svg = host.querySelector("#flow-edges");
  svg.innerHTML = `
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 z" fill="#8b98ac" />
      </marker>
    </defs>
    ${edges.map(e => `<path d="${edgePath(nodes, e)}" fill="none"
        stroke="${e.color || '#b7c0cf'}" stroke-width="1.8"
        stroke-dasharray="${e.dashed ? '5,4' : 'none'}"
        marker-end="url(#arrow)" />`).join("")}
  `;

  nodes.forEach(n => {
    const el = document.createElement("div");
    el.className = `flow-node ${n.type}`;
    el.style.left = n.x + "px";
    el.style.top = n.y + "px";
    el.innerHTML = `
      <div class="handle left"></div>
      <div class="fn-tag">${n.tag}</div>
      <div class="fn-title">${n.title}</div>
      <div class="fn-sub">${n.sub}</div>
      <div class="handle right"></div>
    `;
    world.appendChild(el);
  });

  const viewport = host.querySelector("#flow-viewport");
  function applyTransform() {
    world.style.transform = `translate(${flowPanX}px, ${flowPanY}px) scale(${flowZoom})`;
  }
  applyTransform();

  // 팬(드래그)
  let dragging = false, lastX = 0, lastY = 0;
  viewport.addEventListener("mousedown", (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    viewport.classList.add("grabbing");
  });
  window.addEventListener("mousemove", (e) => {
    if (!dragging) return;
    flowPanX += (e.clientX - lastX);
    flowPanY += (e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
    applyTransform();
  });
  window.addEventListener("mouseup", () => { dragging = false; viewport.classList.remove("grabbing"); });

  // 휠 줌
  viewport.addEventListener("wheel", (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.08 : 0.08;
    flowZoom = Math.min(1.6, Math.max(0.4, flowZoom + delta));
    applyTransform();
  }, { passive: false });

  host.querySelector("#fz-in").onclick = () => { flowZoom = Math.min(1.6, flowZoom + 0.15); applyTransform(); };
  host.querySelector("#fz-out").onclick = () => { flowZoom = Math.max(0.4, flowZoom - 0.15); applyTransform(); };
  host.querySelector("#fz-fit").onclick = () => { flowZoom = 1; flowPanX = 40; flowPanY = 30; applyTransform(); };
}

render();
</script>
